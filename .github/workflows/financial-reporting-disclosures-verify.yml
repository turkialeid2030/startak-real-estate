name: Financial Reporting Disclosures Verify

on:
  pull_request:
    paths:
      - 'src/reporting/financial-reporting-disclosure-packet.js'
      - 'tests/architecture/run_wave12f_financial_reporting_disclosures.js'
      - 'docs/WAVE_12F_FINANCIAL_REPORTING_DISCLOSURES.md'
      - '.github/workflows/financial-reporting-disclosures-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 12F financial reporting disclosures
        run: node tests/architecture/run_wave12f_financial_reporting_disclosures.js
      - name: Canonical release verification
        run: npm run release:verify
