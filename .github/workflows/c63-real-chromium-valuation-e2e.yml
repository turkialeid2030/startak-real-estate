name: C63 Real Chromium Valuation Decision UAT Engineering
on:
  pull_request:
    branches:
      - c62-live-valuation-evidence-boundary-20261008
    paths:
      - 'tests/e2e/run_c63_live_chromium_valuation_e2e.js'
      - '.github/workflows/c63-real-chromium-valuation-e2e.yml'
      - 'docs/C63_REAL_CHROMIUM_EXISTING_BUILDING_E2E.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Assert exact PR commit
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - name: Install genuine Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Build deployable production artifact before browser E2E
        run: npm run build
      - name: Serve actual built Vite React app
        run: |
          (nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/c63-vite.log 2>&1 &)
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/c63-vite.log
          exit 1
      - name: Real Chromium UI case config, institutional HOLD and saved-deal reload
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_c63_live_chromium_valuation_e2e.js
      - name: Preserve C62 and financial gate invariants
        run: |
          node tests/architecture/run_c62_live_institutional_valuation_boundary.js
          node tests/architecture/run_c61_specialized_property_operational_gates.js
          node tests/architecture/run_c60_income_rate_provenance.js
      - run: npm run verify:package
      - run: npm run release:verify
      - run: npm audit --audit-level=low
