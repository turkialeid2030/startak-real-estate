name: C25 Production Source Operational Readiness Verify

on:
  pull_request:
    paths:
      - 'src/source-intelligence/governed-source-operational-readiness.js'
      - 'tests/defects/c25_production_source_operational_readiness.js'
      - 'docs/capabilities/C25_PRODUCTION_SOURCE_OPERATIONAL_READINESS.md'
      - '.github/workflows/c25-production-source-operational-readiness-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C25 source operational readiness adversarial regression
        run: node tests/defects/c25_production_source_operational_readiness.js
      - name: C24 integrated orchestration adversarial regression
        run: node tests/defects/c24_integrated_case_property_orchestration.js
      - name: Canonical release verification
        run: npm run release:verify
