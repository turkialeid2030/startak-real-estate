name: Follow-up App Patch

on:
  pull_request:
    branches:
      - wave/decision-governance-saudi-release-hardening-2026-09-15
    paths:
      - .github/workflows/followup-app-patch.yml
      - tools/apply-followup-app-patch.js

permissions:
  contents: write

jobs:
  patch-app:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wave/decision-governance-ui-integration-followup-2026-09-16'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout follow-up branch
        uses: actions/checkout@v4
        with:
          ref: wave/decision-governance-ui-integration-followup-2026-09-16
          fetch-depth: 0

      - name: Apply numeric editing patch
        run: node tools/apply-followup-app-patch.js

      - name: Commit patched App if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.jsx
          if git diff --cached --quiet; then
            echo "No App changes to commit."
            exit 0
          fi
          git commit -m "Enable temporary empty numeric input editing"
          git push origin HEAD:wave/decision-governance-ui-integration-followup-2026-09-16
