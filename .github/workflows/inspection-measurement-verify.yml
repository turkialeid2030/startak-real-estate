name: Inspection Measurement Verify

on:
  pull_request:
    paths:
      - 'src/inspection/**'
      - 'tests/architecture/run_wave8b_inspection_measurement.js'
      - '.github/workflows/inspection-measurement-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 8B inspection and measurement
        run: node tests/architecture/run_wave8b_inspection_measurement.js
      - name: Canonical release verification
        run: npm run release:verify
