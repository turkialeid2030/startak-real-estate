name: Commercial Specialization Verify

on:
  pull_request:
    paths:
      - 'src/commercial/commercial-specialization.js'
      - 'tests/architecture/run_wave13a_commercial_specialization.js'
      - 'docs/WAVE_13A_COMMERCIAL_SPECIALIZATION.md'
      - '.github/workflows/commercial-specialization-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 13A commercial specialization
        run: node tests/architecture/run_wave13a_commercial_specialization.js
      - name: Canonical release verification
        run: npm run release:verify
