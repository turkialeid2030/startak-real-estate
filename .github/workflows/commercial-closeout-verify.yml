name: Commercial Qualification Closeout Verify

on:
  pull_request:
    paths:
      - 'governance/wave13-commercial-qualification-manifest.json'
      - 'tests/architecture/run_wave13e_commercial_closeout.js'
      - 'docs/WAVE_13E_COMMERCIAL_CLOSEOUT.md'
      - '.github/workflows/commercial-closeout-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 13E commercial closeout
        run: node tests/architecture/run_wave13e_commercial_closeout.js
      - name: Canonical release verification
        run: npm run release:verify
