name: Deep Platform Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deep-platform-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Deep platform verification
        run: node tools/deep-platform-verify.js

      - name: Upload deep verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deep-platform-verification-evidence
          path: runtime-evidence/deep-platform
          if-no-files-found: error
