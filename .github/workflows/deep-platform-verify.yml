name: Deep Platform Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deep-platform-verify:
    runs-on: ubuntu-24.04
    # Match the exact pre-installed Playwright image used by deployed owner
    # acceptance; do not depend on live CDN/apt browser installation.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Chromium without live downloads
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          if (require('playwright/package.json').version !== '1.62.1') throw new Error('PLAYWRIGHT_VERSION_MISMATCH');
          if (!fs.existsSync(chromium.executablePath())) throw new Error('PINNED_CHROMIUM_NOT_FOUND');
          console.log('DEEP_PINNED_CHROMIUM=PASS');
          JS

      - name: Deep platform verification
        run: node tools/deep-platform-verify.js

      - name: Upload deep verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deep-platform-verification-evidence
          path: runtime-evidence/deep-platform
          if-no-files-found: error
