name: Deep Platform Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deep-platform-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Deep platform verification
        run: node tools/deep-platform-verify.js

      - name: Upload deep verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-platform-verification-evidence
          path: runtime-evidence/deep-platform
          if-no-files-found: error
