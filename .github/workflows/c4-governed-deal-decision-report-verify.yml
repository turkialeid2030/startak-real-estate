name: C4 Governed Deal Decision Report Verify

on:
  pull_request:
    paths:
      - 'src/contracts/governed-deal-decision.js'
      - 'src/decision-intelligence/governed-deal-decision.js'
      - 'src/decision-intelligence/index.js'
      - 'src/app/valuation-saved-deal-bridge.js'
      - 'tests/defects/c4_governed_deal_decision_report_integration.js'
      - 'docs/capabilities/C4_GOVERNED_DEAL_DECISION_REPORT_INTEGRATION.md'
      - '.github/workflows/c4-governed-deal-decision-report-verify.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C4 governed deal decision and report integration
        run: node tests/defects/c4_governed_deal_decision_report_integration.js
      - name: C3I C2S governed reconciliation regression
        run: node tests/defects/c3i_c2s_governed_reconciliation_integration.js
      - name: Canonical release verification
        run: npm run release:verify
