name: Successor Exact Release Candidate Artifact Capture

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact trusted main SHA for the collector workflow'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: successor-exact-release-candidate-artifact-capture-75f824da718c
  cancel-in-progress: false

env:
  SOURCE_COMMIT_SHA: 75f824da718c8f4c4bde23a3e08d8ddbe2275689
  STARTAK_SOURCE_COMMIT: 75f824da718c8f4c4bde23a3e08d8ddbe2275689
  STARTAK_BUILD_ENVIRONMENT: github-actions:successor-exact-candidate-artifact-capture
  EVIDENCE_DIR: runtime-evidence/successor-exact-release-candidate-artifact

jobs:
  capture:
    name: successor-exact-release-candidate-artifact-capture
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 330 &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.user.login == github.repository_owner &&
          startsWith(github.event.comment.body, '/startak capture-successor-release-candidate ')
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Bind collector to trusted main and owner authorization
        shell: bash
        env:
          DISPATCH_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha || '' }}
          OWNER_COMMAND_BODY: ${{ github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              expected="$DISPATCH_EXPECTED_MAIN_SHA"
              ;;
            issue_comment)
              if [[ ! "$OWNER_COMMAND_BODY" =~ ^/startak[[:space:]]capture-successor-release-candidate[[:space:]]([0-9a-fA-F]{40})$ ]]; then
                echo 'Owner command must be exactly: /startak capture-successor-release-candidate <40-char-candidate-sha>'
                exit 1
              fi
              requested="${BASH_REMATCH[1]}"
              [[ "${requested,,}" == "${SOURCE_COMMIT_SHA,,}" ]] || {
                echo "Owner command candidate mismatch: requested=$requested pinned=$SOURCE_COMMIT_SHA"
                exit 1
              }
              expected="$GITHUB_SHA"
              ;;
            *) exit 1 ;;
          esac
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo "Collector workflow must execute from trusted main; got ${GITHUB_REF:-<none>}."
            exit 1
          }
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Pinned successor candidate source SHA is invalid.'
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$expected" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Expected main SHA must be 40 hex characters.'; exit 1; }
            [[ "${expected,,}" == "${GITHUB_SHA,,}" ]] || { echo "Expected main SHA mismatch: expected=$expected workflow=$GITHUB_SHA"; exit 1; }
          fi
          echo "Collector workflow ref: ${GITHUB_SHA}"
          echo "Successor candidate source: ${SOURCE_COMMIT_SHA}"

      - name: Checkout exact successor candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 75f824da718c8f4c4bde23a3e08d8ddbe2275689
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$SOURCE_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]] || {
            echo "Exact successor candidate checkout mismatch: expected=$expected actual=$actual"
            exit 1
          }
          echo "EXACT_SUCCESSOR_CANDIDATE_CHECKOUT=PASS sha=$actual"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release verification on exact source
        run: npm run release:verify

      - name: Verify source-bound release manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/release-manifest.json || {
            echo 'dist/release-manifest.json is missing.'
            exit 1
          }
          jq -e --arg sha "$SOURCE_COMMIT_SHA" '
            .schemaVersion == 1
            and .sourceCommit == $sha
            and .sourceCommitBound == true
            and .deploymentVerified == false
            and .productionDeploymentAuthorized == false
            and .evidenceBoundary == "BUILD_TRACE_ONLY_NOT_DEPLOYMENT_PROOF"
          ' dist/release-manifest.json >/dev/null
          echo "SOURCE_BOUND_RELEASE_MANIFEST=PASS sha=${SOURCE_COMMIT_SHA}"

      - name: Create deterministic deployable archive and evidence record
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

          artifact_name="startak-release-candidate-${SOURCE_COMMIT_SHA}.tar"
          artifact_path="$EVIDENCE_DIR/$artifact_name"

          find dist -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$EVIDENCE_DIR/dist-files.sha256"

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --format=gnu \
            --mode='u+rwX,go+rX,go-w' \
            -cf "$artifact_path" \
            dist

          artifact_sha="$(sha256sum "$artifact_path" | awk '{print $1}')"
          tree_manifest_sha="$(sha256sum "$EVIDENCE_DIR/dist-files.sha256" | awk '{print $1}')"
          release_manifest_sha="$(sha256sum dist/release-manifest.json | awk '{print $1}')"
          file_count="$(find dist -type f | wc -l | tr -d ' ')"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -S -n \
            --arg sourceCommitSha "$SOURCE_COMMIT_SHA" \
            --arg collectorWorkflowCommitSha "$GITHUB_SHA" \
            --arg githubRunId "$GITHUB_RUN_ID" \
            --arg githubRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg artifactFile "$artifact_name" \
            --arg artifactSha256 "$artifact_sha" \
            --arg distTreeManifestSha256 "$tree_manifest_sha" \
            --arg releaseManifestSha256 "$release_manifest_sha" \
            --arg buildEnvironment "$STARTAK_BUILD_ENVIRONMENT" \
            --arg generatedAt "$generated_at" \
            --argjson distFileCount "$file_count" \
            '{
              schemaVersion: 2,
              evidenceType: "SUCCESSOR_EXACT_RELEASE_CANDIDATE_BUILD_ARTIFACT_CAPTURE",
              sourceCommitSha: $sourceCommitSha,
              collectorWorkflowCommitSha: $collectorWorkflowCommitSha,
              githubRunId: $githubRunId,
              githubRunAttempt: $githubRunAttempt,
              buildEnvironment: $buildEnvironment,
              artifactFile: $artifactFile,
              artifactDigestScope: "SHA256_OF_DETERMINISTIC_TAR_BYTES_CONTAINING_DIST_DIRECTORY",
              artifactSha256: $artifactSha256,
              distTreeManifestSha256: $distTreeManifestSha256,
              releaseManifestSha256: $releaseManifestSha256,
              distFileCount: $distFileCount,
              sourceCommitBound: true,
              releaseArtifactSelectionPerformed: false,
              deploymentVerified: false,
              productionDeploymentAuthorized: false,
              releaseAuthorized: false,
              mergeAuthorized: false,
              transactionAuthorized: false,
              canonicalBaselineActivated: false,
              evidenceBoundary: "SUCCESSOR_EXACT_SOURCE_BUILD_ARTIFACT_CAPTURE_NOT_DEPLOYMENT_OR_AUTHORIZATION_PROOF",
              generatedAt: $generatedAt
            }' > "$EVIDENCE_DIR/artifact-capture-evidence.json"

          printf '%s  %s\n' "$artifact_sha" "$artifact_name" > "$EVIDENCE_DIR/artifact.sha256"

          echo "SUCCESSOR_EXACT_RELEASE_CANDIDATE_ARTIFACT_CAPTURE=PASS"
          echo "ARTIFACT_SHA256=$artifact_sha"
          echo "DIST_TREE_MANIFEST_SHA256=$tree_manifest_sha"
          echo "RELEASE_MANIFEST_SHA256=$release_manifest_sha"
          echo "RELEASE_ARTIFACT_SELECTION_PERFORMED=false"
          echo "PRODUCTION_DEPLOYMENT_AUTHORIZED=false"

      - name: Upload exact successor candidate artifact capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-release-candidate-artifact-75f824da718c
          path: runtime-evidence/successor-exact-release-candidate-artifact
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish non-authorizing summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Successor Exact Release Candidate Artifact Capture'
            echo
            echo "- Successor source commit: \`${SOURCE_COMMIT_SHA}\`"
            echo "- Collector workflow commit: \`${GITHUB_SHA}\`"
            if [[ -f "$EVIDENCE_DIR/artifact.sha256" ]]; then
              digest="$(awk '{print $1}' "$EVIDENCE_DIR/artifact.sha256")"
              echo "- Deterministic successor archive SHA-256: \`${digest}\`"
            fi
            echo '- Captured archive is source-bound build evidence only.'
            echo '- Release-artifact selection is not itself merge/deployment authority.'
            echo '- No production deployment, release authority, merge authority, canonical switch, Go-Live, or transaction authority is granted.'
          } >> "$GITHUB_STEP_SUMMARY"
