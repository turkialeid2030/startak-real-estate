name: D04 Registered Locale Matrix
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: d04-locale-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  locale-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STARTAK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node tests/e2e/run_d04_locale_matrix_ci.mjs
      - name: Preserve locale matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d04-locale-${{ github.event.pull_request.head.sha }}
          path: runtime-evidence/remaining-audit/d04-locale-matrix.json
          if-no-files-found: warn
