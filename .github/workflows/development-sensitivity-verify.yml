name: Development Sensitivity Verify

on:
  pull_request:
    paths:
      - 'src/development/**'
      - 'src/engines/valuation/development-sensitivity.js'
      - 'tests/architecture/run_wave11d_development_sensitivity.js'
      - 'docs/WAVE_11D_DEVELOPMENT_SENSITIVITY.md'
      - '.github/workflows/development-sensitivity-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 11D Development sensitivity and uncertainty
        run: node tests/architecture/run_wave11d_development_sensitivity.js
      - name: Canonical release verification
        run: npm run release:verify
