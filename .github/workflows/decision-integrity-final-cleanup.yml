name: Decision Integrity Final Cleanup

on:
  push:
    branches:
      - remediation/decision-integrity-wave-2026-09-14
    paths:
      - tools/finalize-decision-integrity-cleanup.py
      - .github/workflows/decision-integrity-final-cleanup.yml

permissions:
  contents: write

jobs:
  finalize-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: remediation/decision-integrity-wave-2026-09-14
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final cleanup
        run: python3 tools/finalize-decision-integrity-cleanup.py

      - name: Install dependencies
        run: npm ci

      - name: Run decision-integrity regression
        run: npm run test:decision-integrity

      - name: Verify updated MetricRow inventory closure
        run: node tests/i18n/run_metricrow_full_closure.js

      - name: Run canonical release verification
        run: npm run release:verify

      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests I18N_R2B_METRICROW_INVENTORY.csv
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Finalize financial UI inventory and localization integrity"
          git push origin HEAD:remediation/decision-integrity-wave-2026-09-14
