name: Cost Approach Verify

on:
  pull_request:
    paths:
      - 'src/cost/**'
      - 'src/engines/valuation/cost-approach.js'
      - 'tests/architecture/run_wave11a_cost_approach.js'
      - 'docs/WAVE_11A_COST_APPROACH.md'
      - '.github/workflows/cost-approach-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 11A Cost Approach
        run: node tests/architecture/run_wave11a_cost_approach.js
      - name: Canonical release verification
        run: npm run release:verify
