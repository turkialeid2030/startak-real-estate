name: C68 Native Vite Bundled React HMR Browser Proof
on:
  pull_request:
    branches:
      - c67-vite8-native-bundled-dev-chromium-20261008
    paths:
      - 'tests/e2e/run_c68_native_bundled_react_hmr.js'
      - 'docs/C68_NATIVE_BUNDLED_REACT_HMR_EVIDENCE.md'
      - '.github/workflows/c68-native-react-hmr-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start TRUE bundled Vite development server
        run: |
          (nohup npm run dev:bundled -- --host 127.0.0.1 --port 4176 --strictPort > /tmp/c68-native.log 2>&1 &)
          for n in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4176/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/c68-native.log
          exit 1
      - name: Real React code edit/HMR without full reload and authority HOLD
        env:
          STARTAK_C68_URL: http://127.0.0.1:4176
        run: |
          node tests/e2e/run_c68_native_bundled_react_hmr.js || {
            echo "=== C68 REAL NATIVE VITE HMR LOGS ==="
            cat /tmp/c68-native.log
            exit 1
          }
      - name: Restore source code safety before qualification
        run: test -z "$(git status --short -- src/components/LandDevelopmentInstitutionalNotice.jsx)"
      - name: Existing financial and land authority invariants
        run: |
          node tests/architecture/run_c64_land_institutional_hold.js
          node tests/architecture/run_c65_institutional_arabic_reasons.js
          node tests/architecture/run_c62_live_institutional_valuation_boundary.js
      - run: npm run build
      - run: npm run verify:package
      - run: npm run release:verify
      - run: npm audit --audit-level=low
