name: Development Residual Verify

on:
  pull_request:
    paths:
      - 'src/development/**'
      - 'src/engines/valuation/residual-land-value.js'
      - 'tests/architecture/run_wave11c_development_residual.js'
      - 'docs/WAVE_11C_DEVELOPMENT_RESIDUAL.md'
      - '.github/workflows/development-residual-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 11C Development Property residual
        run: node tests/architecture/run_wave11c_development_residual.js
      - name: Canonical release verification
        run: npm run release:verify
