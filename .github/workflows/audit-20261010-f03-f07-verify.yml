name: Audit 2026-10-10 F03-F07 Owner Study and Draft Persistence
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/i18n/**'
      - 'src/validation/saved-deal-schema.js'
      - 'src/storage/**'
      - 'src/valuation-intelligence/personal-limited-interest-case-archive.js'
      - 'src/valuation-intelligence/personal-phased-development-dcf.js'
      - 'tests/architecture/run_personal_phased_development_dcf.js'
      - 'tests/architecture/run_full_platform_synthetic_simulation.js'
      - 'tests/architecture/run_external_three_gates_readiness.js'
      - 'tests/defects/independent_preregistration_witness_c56.js'
      - 'src/validation/independent-pre-registration-witness.js'
      - 'src/validation/server-external-three-gates-readiness.js'
      - 'src/governance/external-three-gates-readiness.js'
      - 'src/components/ExternalThreeGatesReadinessPanel.jsx'
      - 'tests/e2e/run_personal_phased_development_browser.js'
      - 'tests/e2e/run_all_13_asset_classes_public_smoke.js'
      - 'tests/architecture/run_personal_limited_interest_archive.js'
      - 'tests/e2e/run_personal_limited_interest_archive_browser.js'
      - 'src/document-intelligence/**'
      - 'src/decision-actions/**'
      - 'src/project-model/**'
      - 'src/runtime/**'
      - 'src/residential-income-acquisition/**'
      - 'src/main.jsx'
      - 'src/index.css'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/fixtures/**'
      - 'tests/architecture/run_audit_20261010_remaining.js'
      - 'tests/e2e/run_audit_20261010_remaining_browser.js'
      - 'tests/e2e/run_audit_20261020_local_ocr_browser.js'
      - 'tests/e2e/run_audit_20261020_backup_browser.js'
      - 'tests/e2e/run_audit_20261020_lease_lifecycle_browser.js'
      - 'tests/e2e/run_audit_20261021_durable_recovery_browser.js'
      - 'tests/e2e/run_audit_20261021_process_crash_browser.js'
      - 'tests/e2e/run_audit_20261021_document_tables_browser.js'
      - 'tests/e2e/local-tls-preview.js'
      - 'tools/local-ocr-assets.mjs'
      - 'public/_headers'
      - 'vite.config.*'
      - 'tests/architecture/run_audit_20261010_f03_f07.js'
      - 'tests/e2e/run_audit_20261010_f03_f07_browser.js'
      - 'docs/AUDIT_20261010_F03_F07_OWNER_STUDY_REMEDIATION.md'
      - 'docs/AUDIT_20261010_REMAINING_REVIEW.md'
      - '.github/workflows/standards-provenance-verify.yml'
      - '.github/workflows/audit-20261010-f03-f07-verify.yml'
      - '.github/workflows/audit-20261010-deployed-owner-verify.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
env:
  STARTAK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  owner-study-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Bind tested source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - run: npm ci
      - run: node tests/architecture/run_audit_20261010_f03_f07.js
      - run: node tests/architecture/run_personal_limited_interest_archive.js
      - run: node tests/architecture/run_personal_phased_development_dcf.js
      - run: node tests/architecture/run_full_platform_synthetic_simulation.js
      - run: node tests/architecture/run_external_three_gates_readiness.js
      - run: node tests/defects/independent_preregistration_witness_c56.js
      - run: node tests/architecture/run_audit_20261010_f01_f02.js
      - run: node tests/architecture/run_audit_20261010_remaining.js
  chromium-owner-study:
    runs-on: ubuntu-24.04
    # Pin the same official Playwright image already qualified by deployed-owner-acceptance.
    # Browser executables are present in the image; do not depend on live apt/CDN downloads.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Bind tested source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - run: npm ci
      - name: Verify exact pinned Playwright 1.62.1 browsers without live downloads
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const {chromium,firefox,webkit}=require('playwright');
          const version=require('playwright/package.json').version;
          if(version!=='1.62.1')throw Error('PLAYWRIGHT_VERSION_MISMATCH');
          for(const [kind,engine] of Object.entries({chromium,firefox,webkit})){
            if(!fs.existsSync(engine.executablePath()))throw Error('PINNED_BROWSER_NOT_FOUND_'+kind);
          }
          console.log('PLAYWRIGHT_PINNED_CHROMIUM_FIREFOX_WEBKIT=PASS');
          JS
      - run: npm run build
      - name: Serve production build
        shell: bash
        run: |
          set -euo pipefail
          (nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/owner-study-vite.log 2>&1 &)
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/owner-study-vite.log
          exit 1
      - name: Source-linked native PDF and actual OCR tables, restore and evidence gates
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261021_document_tables_browser.js
      - name: Actual owned Chromium process kills during mutations and recovery
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261021_process_crash_browser.js
      - name: Actual desktop and mobile Arabic workflows
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261010_f03_f07_browser.js
      - name: Existing personal export compatibility
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_c75_real_chromium_personal_study.js
      - name: Real browser limited-property-rights archive input, tamper, and isolation
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_personal_limited_interest_archive_browser.js
      - name: Real browser C55 phased land development DCF and negative guardrails
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_personal_phased_development_browser.js
      - name: Real browser 13-sector owner classification and hard-HOLD
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_all_13_asset_classes_public_smoke.js
      - name: Lease lifecycle, retained terms, current-source review and saved report acceptance
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
          STARTAK_LEASE_VISUAL_PREVIEW: '1'
        run: node tests/e2e/run_audit_20261020_lease_lifecycle_browser.js
      - name: Durable local recovery, persisted interruptions and startup write block
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261021_durable_recovery_browser.js
      - name: Cross-browser backup transfer, conflicts, rollback and concurrent restore
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261020_backup_browser.js
      - name: Local Arabic/English OCR, selected PDF pages, CSP and worker lifecycle
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261020_local_ocr_browser.js
      - name: Native PDF, source journals, gap actions, keyboard and print acceptance
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_audit_20261010_remaining_browser.js
      - name: Save browser and print evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-audit-browser-print-evidence
          path: runtime-evidence/remaining-audit
          if-no-files-found: error
  independent-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Bind tested source
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - run: npm ci
      - run: npm run release:verify
      - run: npm audit --audit-level=low
  gate:
    if: always()
    needs: [owner-study-regression, chromium-owner-study, independent-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Require actual successful jobs on the tested source
        env:
          REGRESSION: ${{ needs.owner-study-regression.result }}
          BROWSER: ${{ needs.chromium-owner-study.result }}
          RELEASE: ${{ needs.independent-release.result }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$REGRESSION" = success
          test "$BROWSER" = success
          test "$RELEASE" = success
          echo "AUDIT_20261010_F03_F07_ENGINEERING_GATE=PASS sha=$SHA"
          echo "MARKET_DATA_AND_ALL_ASSET_CATEGORIES_VERIFIED=FALSE"
