name: Historical diagnostic parity verification
on:
  pull_request:
    paths:
      - '.github/workflows/owner-hidden-diagnostics-verification.yml'
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'vite.config.*'
      - 'public/_headers'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startak-owner-hidden-diagnostics-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  diagnostic-parity:
    name: Diagnostic parity (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: local-ocr
            script: tests/e2e/run_audit_20261020_local_ocr_browser.js
            evidence: local-ocr-acceptance.json
          - suite: remaining-audit
            script: tests/e2e/run_audit_20261010_remaining_browser.js
            evidence: acceptance.json
          - suite: document-tables
            script: tests/e2e/run_audit_20261021_document_tables_browser.js
            evidence: document-tables-acceptance.json
    env:
      STARTAK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      STARTAK_E2E_URL: http://127.0.0.1:4173
      DIAGNOSTIC_SCRIPT: ${{ matrix.script }}
      DIAGNOSTIC_EVIDENCE: ${{ matrix.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: test "$(git rev-parse HEAD)" = "$STARTAK_SOURCE_COMMIT"
      - run: npm ci
      - name: Verify pinned browser executables
        run: |
          node -e "const fs=require('node:fs');const p=require('playwright');if(require('playwright/package.json').version!=='1.62.1')throw Error('PLAYWRIGHT_VERSION_MISMATCH');for(const name of ['chromium','firefox','webkit'])if(!fs.existsSync(p[name].executablePath()))throw Error('BROWSER_UNAVAILABLE_'+name)"
      - run: npm run build
      - name: Run original browser suite independently
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/hidden-diagnostics
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >runtime-evidence/hidden-diagnostics/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 90); do
            if curl --fail --silent "$STARTAK_E2E_URL/" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$STARTAK_E2E_URL/" >/dev/null
          printf 'SOURCE_SHA=%s\n' "$STARTAK_SOURCE_COMMIT" | tee runtime-evidence/hidden-diagnostics/source.txt
          started_ns="$(date +%s%N)"
          node "$DIAGNOSTIC_SCRIPT" 2>&1 | tee runtime-evidence/hidden-diagnostics/browser.log
          ended_ns="$(date +%s%N)"
          printf 'SUITE_DURATION_MS=%s\n' "$(( (ended_ns - started_ns) / 1000000 ))" | tee runtime-evidence/hidden-diagnostics/timing.txt
      - name: Require exact SHA and all six browser viewport combinations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {validateHistoricalEvidence}=require('./tools/historical-diagnostic-evidence');
          const e = JSON.parse(fs.readFileSync('runtime-evidence/remaining-audit/' + process.env.DIAGNOSTIC_EVIDENCE, 'utf8'));
          const result=validateHistoricalEvidence(e,process.env.DIAGNOSTIC_EVIDENCE,process.env.STARTAK_SOURCE_COMMIT);
          console.log('HISTORICAL_DIAGNOSTIC_CHECK_ACCOUNTING=PASS contexts='+result.contexts+' checks='+result.checks);
          console.log('HISTORICAL_DIAGNOSTIC_EXACT_HEAD_MATRIX=PASS');
          NODE
      - name: Preserve exact suite logs and browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-diagnostic-${{ matrix.suite }}
          path: |
            runtime-evidence/hidden-diagnostics/
            runtime-evidence/remaining-audit/
          if-no-files-found: warn
          retention-days: 14
