name: Financial Horizon Diagnostic 397

on:
  push:
    branches:
      - fix/financial-horizon-failclosed-397

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture target and release diagnostics
        shell: bash
        run: |
          mkdir -p diagnostic-397
          set +e
          node tests/defects/financial_horizon_fail_closed_397.js > diagnostic-397/target.log 2>&1
          echo $? > diagnostic-397/target.exit
          npm run release:verify > diagnostic-397/release.log 2>&1
          echo $? > diagnostic-397/release.exit
          set -e
          cat diagnostic-397/target.log
          tail -n 250 diagnostic-397/release.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: financial-horizon-diagnostic-397
          path: diagnostic-397
          if-no-files-found: error
