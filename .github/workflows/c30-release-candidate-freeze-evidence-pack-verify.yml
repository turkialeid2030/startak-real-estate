name: C30 Release Candidate Freeze Evidence Pack Verify

on:
  pull_request:
    paths:
      - 'src/release/governed-release-candidate.js'
      - 'tests/defects/c30_release_candidate_freeze_evidence_pack.js'
      - 'docs/capabilities/C30_RELEASE_CANDIDATE_FREEZE_EVIDENCE_PACK.md'
      - '.github/workflows/c30-release-candidate-freeze-evidence-pack-verify.yml'
      - 'src/presentation/integrated-case-review.js'
      - 'src/components/IntegratedCaseReviewPanel.jsx'
      - 'src/main.jsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C30 release-candidate evidence-pack regression
        env:
          C30_EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tests/defects/c30_release_candidate_freeze_evidence_pack.js
      - name: Integrated review UI regression
        run: node tests/defects/c26_integrated_case_review_ui.js
      - name: C29 shadow simulation and UAT harness regression
        run: node tests/defects/c29_governed_shadow_simulation_uat_harness.js
      - name: C28 comprehensive integration regression
        run: node tests/defects/c28_comprehensive_integration_qualification.js
      - name: C23 AI proof-grounding regression
        run: node tests/defects/c23_governed_live_ai_provider_gateway.js
      - name: Production build
        run: npm run build
      - name: Package verification
        run: npm run verify:package
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Canonical release verification
        run: npm run release:verify
