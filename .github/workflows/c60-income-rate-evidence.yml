name: C60 Income Rate Source and Stress Evidence
on:
  pull_request:
    branches:
      - c59-componentized-cost-obsolescence-20261008
    paths:
      - 'src/valuation-intelligence/market-rate-provenance.js'
      - 'tests/architecture/run_c60_income_rate_provenance.js'
      - 'docs/C60_MARKET_CAP_DISCOUNT_EXIT_EVIDENCE.md'
      - '.github/workflows/c60-income-rate-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - name: C60 market rate provenance
        run: node tests/architecture/run_c60_income_rate_provenance.js
      - name: Legacy rate and C59 guards
        run: |
          node tests/architecture/run_c59_componentized_cost_obsolescence.js
          node tests/architecture/run_wave11a_cost_approach.js
      - run: npm run build
      - run: npm run verify:package
      - run: npm run release:verify
      - run: npm audit --audit-level=low
