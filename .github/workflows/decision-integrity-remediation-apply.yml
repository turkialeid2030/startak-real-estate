name: Decision Integrity Remediation Apply

on:
  push:
    branches:
      - remediation/decision-integrity-wave-2026-09-14
    paths:
      - tools/apply-decision-integrity-remediation.py

permissions:
  contents: write

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: remediation/decision-integrity-wave-2026-09-14
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic remediation
        run: python3 tools/apply-decision-integrity-remediation.py

      - name: Install dependencies
        run: npm ci

      - name: Run decision-integrity regression
        run: node tests/defects/decision_integrity_wave.js

      - name: Run canonical release verification
        run: npm run release:verify

      - name: Commit verified remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests/defects package.json
          if git diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git commit -m "Fix financial input integrity and decision-result parity"
          git push origin HEAD:remediation/decision-integrity-wave-2026-09-14
