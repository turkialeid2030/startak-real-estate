name: E2H Execution Attestation Post Deployment Closeout Verify

on:
  pull_request:
    paths:
      - 'governance/e2h-execution-attestation-post-deployment-closeout-policy-2026-09-08.json'
      - 'src/standards/execution-attestation-post-deployment-closeout.js'
      - 'tests/architecture/run_e2h_execution_attestation_post_deployment_closeout.js'
      - 'docs/E2H_EXECUTION_ATTESTATION_POST_DEPLOYMENT_CLOSEOUT_2026-09-08.md'
      - '.github/workflows/e2h-execution-attestation-post-deployment-closeout-verify.yml'
      - 'src/standards/human-release-authority-deployment-decision.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify E2H execution attestation and post-deployment closeout gate
        run: node tests/architecture/run_e2h_execution_attestation_post_deployment_closeout.js
      - name: Re-verify E2G human release authority gate
        run: node tests/architecture/run_e2g_human_release_authority_deployment_decision.js
      - name: Canonical release verification
        run: npm run release:verify
