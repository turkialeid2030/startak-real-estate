name: C8 Governed Title Survey Property Evidence Verify

on:
  pull_request:
    paths:
      - 'src/property/governed-title-survey-verification.js'
      - 'src/property/index.js'
      - 'src/document-intelligence/professional-evidence-chain.js'
      - 'src/document-intelligence/reconciliation.js'
      - 'src/document-intelligence/contracts.js'
      - 'tests/defects/c8_governed_title_survey_property_evidence.js'
      - 'docs/capabilities/C8_GOVERNED_TITLE_SURVEY_PROPERTY_EVIDENCE.md'
      - '.github/workflows/c8-governed-title-survey-property-evidence-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C8 governed title survey property evidence regression
        run: node tests/defects/c8_governed_title_survey_property_evidence.js
      - name: Canonical release verification
        run: npm run release:verify
