name: C19 Governed Policy Shock Comparable Impact Verify

on:
  pull_request:
    paths:
      - 'src/market/governed-policy-shock-comparable-impact.js'
      - 'tests/defects/c19_governed_policy_shock_comparable_impact.js'
      - 'docs/capabilities/C19_GOVERNED_POLICY_SHOCK_COMPARABLE_IMPACT.md'
      - '.github/workflows/c19-governed-policy-shock-comparable-impact-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C19 governed policy shock comparable impact regression
        run: node tests/defects/c19_governed_policy_shock_comparable_impact.js
      - name: C18 governed subdivision merge regression
        run: node tests/defects/c18_governed_subdivision_merge_review.js
      - name: Canonical release verification
        run: npm run release:verify
