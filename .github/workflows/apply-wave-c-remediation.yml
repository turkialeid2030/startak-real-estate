name: Apply Wave C Remediation

on:
  push:
    branches:
      - feature/wave-c-remediation-v1
    paths:
      - scripts/apply-wave-c-remediation.py
      - .github/workflows/apply-wave-c-remediation.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/wave-c-remediation-v1
          fetch-depth: 0

      - name: Stop if remediation already applied
        id: gate
        shell: bash
        run: |
          if [[ -f WAVE_C_APPLIED ]]; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply remediation
        if: steps.gate.outputs.already_applied != 'true'
        run: python3 scripts/apply-wave-c-remediation.py

      - name: Setup Node.js
        if: steps.gate.outputs.already_applied != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.already_applied != 'true'
        run: npm ci

      - name: Wave C focused verification
        if: steps.gate.outputs.already_applied != 'true'
        run: |
          node tests/architecture/run_wave_c_remediation_v1.js
          node tests/architecture/run_riai_ai_gateway_guardrails_unit_v1.js
          node tests/architecture/run_riai_ai_gateway_integration_v1.js
          node tests/architecture/run_riai_decision_language_paraphrase_v1.js

      - name: Canonical release verification
        if: steps.gate.outputs.already_applied != 'true'
        run: npm run release:verify

      - name: Commit verified remediation to branch
        if: steps.gate.outputs.already_applied != 'true'
        shell: bash
        run: |
          git config user.name "STARTAK Wave C Remediation"
          git config user.email "engineering@startak.local"
          git add -A
          git commit -m "Apply Wave C.1-C.3 remediation with runtime verification"
          git push origin HEAD:feature/wave-c-remediation-v1
