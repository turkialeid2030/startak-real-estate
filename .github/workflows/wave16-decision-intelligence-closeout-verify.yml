name: Wave 16 Decision Intelligence Closeout Verify

on:
  pull_request:
    paths:
      - 'src/uncertainty/**'
      - 'src/portfolio/**'
      - 'src/investment-committee/**'
      - 'tests/architecture/run_scenario_risk_intelligence_v1.js'
      - 'tests/architecture/run_wave16a_monte_carlo_governance.js'
      - 'tests/architecture/run_wave16b_tail_risk_thresholds.js'
      - 'tests/architecture/run_wave16c_portfolio_concentration.js'
      - 'tests/architecture/run_wave16d_investment_committee_governance.js'
      - 'tests/architecture/run_wave16e_decision_intelligence_closeout.js'
      - '.github/workflows/wave16-decision-intelligence-closeout-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing scenario risk regression
        run: node tests/architecture/run_scenario_risk_intelligence_v1.js
      - name: Wave 16A Monte Carlo governance
        run: node tests/architecture/run_wave16a_monte_carlo_governance.js
      - name: Wave 16B tail risk thresholds
        run: node tests/architecture/run_wave16b_tail_risk_thresholds.js
      - name: Wave 16C portfolio concentration
        run: node tests/architecture/run_wave16c_portfolio_concentration.js
      - name: Wave 16D Investment Committee governance
        run: node tests/architecture/run_wave16d_investment_committee_governance.js
      - name: Wave 16E closeout
        run: node tests/architecture/run_wave16e_decision_intelligence_closeout.js
      - name: Canonical release verification
        run: npm run release:verify
