name: Wave B2 Apply

on:
  push:
    branches:
      - feat/wave-b2-user-entered-zakat-layer

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply corrected Wave B2 implementation
        run: python tools/wave-b2-apply-v2.py
      - name: Run Wave B2 contract test
        run: node tests/zakat/run_user_entered_zakat_layer.js
      - name: Run canonical release verification
        run: npm run release:verify
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wave B2: add separated user-entered post-NOI zakat layer"
          git push origin HEAD:feat/wave-b2-user-entered-zakat-layer
