name: C64 Real Chromium Land Development Institutional Boundary
on:
  pull_request:
    branches:
      - c65-arabic-institutional-hold-disclosure-20261008
    paths:
      - 'src/app/land-development-institutional-boundary.js'
      - 'src/components/LandDevelopmentInstitutionalNotice.jsx'
      - 'src/app/App.jsx'
      - 'tests/architecture/run_c64_land_institutional_hold.js'
      - 'tests/e2e/run_c64_land_live_chromium.js'
      - 'docs/C64_LAND_REAL_CHROMIUM_STAGE1.md'
      - '.github/workflows/c64-land-live-browser-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Assert exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - name: C64 and C65 deterministic governance
        run: |
          node tests/architecture/run_c64_land_institutional_hold.js
          node tests/architecture/run_c65_institutional_arabic_reasons.js
          node tests/architecture/run_c62_live_institutional_valuation_boundary.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Serve real production bundle
        run: |
          (nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/c64-preview.log 2>&1 &)
          for n in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/c64-preview.log
          exit 1
      - name: Real browser land and development mode with saved case reload
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_c64_land_live_chromium.js
      - name: Existing three office retail residential browser regression
        env:
          STARTAK_E2E_URL: http://127.0.0.1:4173
        run: node tests/e2e/run_c63_live_chromium_valuation_e2e.js
      - run: npm run verify:package
      - run: npm run release:verify
      - run: npm audit --audit-level=low
