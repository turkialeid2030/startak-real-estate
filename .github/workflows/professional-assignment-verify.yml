name: Professional Assignment Verify

on:
  pull_request:
    paths:
      - 'src/valuation/professional-assignment.js'
      - 'tests/architecture/run_professional_assignment_v1.js'
      - 'docs/WAVE_7C_PROFESSIONAL_ASSIGNMENT.md'
      - '.github/workflows/professional-assignment-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wave 7C professional assignment
        run: node tests/architecture/run_professional_assignment_v1.js

      - name: Canonical release verification
        run: npm run release:verify
