name: Hardening Preview Live E2E

on:
  push:
    branches:
      - qa/hardening-preview-live-e2e

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_URL: https://dff59619.startak-real-estate.pages.dev/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reuse qualified production live probe
        shell: bash
        run: |
          git fetch origin qa/production-live-comprehensive-20260830 --depth=1
          git show FETCH_HEAD:tests/e2e/production_live_e2e.mjs > tests/e2e/production_live_e2e.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run comprehensive live E2E against hardening preview
        run: node tests/e2e/production_live_e2e.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startak-hardening-preview-live-e2e-evidence
          path: runtime-evidence/production-live/
          if-no-files-found: warn
          retention-days: 7
