name: Report Conformance QA Verify

on:
  pull_request:
    paths:
      - 'src/reporting/**'
      - 'src/standards/**'
      - 'tests/architecture/run_wave15c_report_conformance_qa.js'
      - '.github/workflows/report-conformance-qa-verify.yml'
      - 'docs/WAVE_15C_REPORT_CONFORMANCE_QA.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 15C report conformance QA regression
        run: node tests/architecture/run_wave15c_report_conformance_qa.js
      - name: Canonical release verification
        run: npm run release:verify
