name: C27 Governed Observability Operational Safety Verify

on:
  pull_request:
    paths:
      - 'src/observability/governed-operational-telemetry.js'
      - 'tests/defects/c27_governed_observability_operational_safety.js'
      - 'docs/capabilities/C27_GOVERNED_OBSERVABILITY_OPERATIONAL_SAFETY.md'
      - '.github/workflows/c27-governed-observability-operational-safety-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C27 observability operational safety regression
        run: node tests/defects/c27_governed_observability_operational_safety.js
      - name: C26 operator workspace RBAC regression
        run: node tests/defects/c26_governed_operator_workspace_rbac.js
      - name: Canonical release verification
        run: npm run release:verify
