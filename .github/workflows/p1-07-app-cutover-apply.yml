name: P1-07 App Cutover Apply

on:
  push:
    branches:
      - wave/decision-governance-saudi-release-hardening-2026-09-15
    paths:
      - '.github/workflows/p1-07-app-cutover-apply.yml'

permissions:
  contents: write

jobs:
  apply-cutover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wave/decision-governance-saudi-release-hardening-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply guarded working-tree patch
        run: node scripts/apply-p1-07-app-cutover.js
      - name: Verify source contract before commit
        run: node tests/decision-governance/app-cutover-source-contract.test.js
      - name: Verify focused governance tests
        run: |
          node tests/decision-governance/app-workspace-cutover.test.js
          node tests/decision-governance/guided-decision-flow.test.js
          node tests/decision-governance/financial-hard-gates.test.js
      - name: Commit cutover
        run: |
          if git diff --quiet -- src/app/App.jsx; then
            echo 'No App.jsx change produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.jsx
          git commit -m 'P1-07: cut over App runtime to governed blank New Deal workspace'
          git push origin HEAD:wave/decision-governance-saudi-release-hardening-2026-09-15
