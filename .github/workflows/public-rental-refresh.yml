name: Public Rental Data Refresh
on:
  pull_request:
    paths:
      - 'tools/refresh-public-rental-data.js'
      - 'src/reporting/public-rent-reference.js'
      - 'public/market-data/**'
      - 'tests/defects/public_rent_reference.js'
      - '.github/workflows/public-rental-refresh.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 2 * * 0'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify real seeded data
        run: node tests/defects/public_rent_reference.js
      - name: Retrieve published regional files
        run: node tools/refresh-public-rental-data.js
      - name: Preserve retrieved files and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: public-rental-refresh-${{ github.run_id }}
          path: runtime-evidence/rental-public-refresh
          if-no-files-found: warn
          retention-days: 90
