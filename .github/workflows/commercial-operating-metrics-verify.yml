name: Commercial Operating Metrics Verify

on:
  pull_request:
    paths:
      - 'src/commercial/commercial-operating-metrics.js'
      - 'tests/architecture/run_wave13c_commercial_operating_metrics.js'
      - 'docs/WAVE_13C_COMMERCIAL_OPERATING_METRICS.md'
      - '.github/workflows/commercial-operating-metrics-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 13C commercial operating metrics
        run: node tests/architecture/run_wave13c_commercial_operating_metrics.js
      - name: Canonical release verification
        run: npm run release:verify
