name: Commercial Operating Stress Verify

on:
  pull_request:
    paths:
      - 'src/commercial/commercial-operating-stress.js'
      - 'tests/architecture/run_wave13d_commercial_operating_stress.js'
      - 'docs/WAVE_13D_COMMERCIAL_OPERATING_STRESS.md'
      - '.github/workflows/commercial-operating-stress-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 13D commercial operating stress
        run: node tests/architecture/run_wave13d_commercial_operating_stress.js
      - name: Canonical release verification
        run: npm run release:verify
