name: Specialized Operating Forecast Verify

on:
  pull_request:
    paths:
      - 'src/engines/valuation/specialized-operating-forecast.js'
      - 'src/specialized-assets/specialized-operating-forecast.js'
      - 'src/specialized-assets/specialized-forecast-assumptions.js'
      - 'tests/architecture/run_wave14f_specialized_operating_forecast.js'
      - 'docs/WAVE_14F_SPECIALIZED_OPERATING_FORECAST.md'
      - '.github/workflows/specialized-operating-forecast-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 14F specialized operating forecast
        run: node tests/architecture/run_wave14f_specialized_operating_forecast.js
      - name: Canonical release verification
        run: npm run release:verify
