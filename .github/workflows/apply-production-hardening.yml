name: Apply Production Hardening

on:
  push:
    branches:
      - hardening/production-security-a11y

permissions:
  contents: write

jobs:
  apply-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply targeted hardening changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app/App.jsx')
          text = app.read_text()
          old = '''      <button\n        type="button"\n        onClick={() => onChange(!checked)}\n        className="relative shrink-0"'''
          new = '''      <button\n        type="button"\n        role="switch"\n        aria-checked={checked}\n        aria-label={label}\n        onClick={() => onChange(!checked)}\n        className="relative shrink-0"'''
          if old not in text:
              raise SystemExit('Toggle button target not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Toggle implementation, found {text.count(old)}')
          app.write_text(text.replace(old, new, 1))

          headers = Path('public/_headers')
          headers.parent.mkdir(parents=True, exist_ok=True)
          headers.write_text("""/*\n  Content-Security-Policy: default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests\n  Permissions-Policy: geolocation=(), microphone=(), camera=()\n  Strict-Transport-Security: max-age=31536000; includeSubDomains\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n""")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run canonical release verification before commit
        run: npm run release:verify

      - name: Verify hardening artifacts
        shell: bash
        run: |
          grep -F 'role="switch"' src/app/App.jsx
          grep -F 'aria-checked={checked}' src/app/App.jsx
          grep -F 'aria-label={label}' src/app/App.jsx
          grep -F 'Content-Security-Policy:' public/_headers
          grep -F 'Permissions-Policy:' public/_headers
          grep -F 'Strict-Transport-Security:' public/_headers

      - name: Commit targeted changes and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/apply-production-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/App.jsx public/_headers .github/workflows/apply-production-hardening.yml
          git diff --cached --check
          git commit -m 'hardening: add production security headers and switch accessibility'
          git push origin HEAD:hardening/production-security-a11y
