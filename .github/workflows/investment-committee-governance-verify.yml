name: Investment Committee Governance Verify

on:
  pull_request:
    paths:
      - 'src/investment-committee/**'
      - 'src/portfolio/**'
      - 'tests/architecture/run_wave16c_portfolio_concentration.js'
      - 'tests/architecture/run_wave16d_investment_committee_governance.js'
      - '.github/workflows/investment-committee-governance-verify.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 16C portfolio concentration regression
        run: node tests/architecture/run_wave16c_portfolio_concentration.js
      - name: Wave 16D Investment Committee governance regression
        run: node tests/architecture/run_wave16d_investment_committee_governance.js
      - name: Canonical release verification
        run: npm run release:verify
