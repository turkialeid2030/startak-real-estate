name: Audit 2026-10-10 Deployed Owner Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tests/e2e/run_audit_20261010_*'
      - 'tests/e2e/run_audit_20261020_local_ocr_browser.js'
      - 'tests/e2e/run_audit_20261020_backup_browser.js'
      - 'tests/e2e/run_audit_20261020_lease_lifecycle_browser.js'
      - 'tests/e2e/run_audit_20261021_durable_recovery_browser.js'
      - 'tests/e2e/run_audit_20261021_process_crash_browser.js'
      - 'tests/e2e/run_audit_20261021_document_tables_browser.js'
      - 'tests/fixtures/document-table.js'
      - 'tests/fixtures/synthetic-interrupted-saved-deals.js'
      - 'tests/e2e/local-tls-preview.js'
      - 'tests/fixtures/synthetic-backup-deals.js'
      - 'tools/local-ocr-assets.mjs'
      - 'public/_headers'
      - 'tests/e2e/run_c75_real_chromium_personal_study.js'
      - 'tests/e2e/run_personal_limited_interest_archive_browser.js'
      - 'tests/e2e/run_personal_phased_development_browser.js'
      - '.github/workflows/audit-20261010-deployed-owner-verify.yml'
  workflow_dispatch:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  # Issue comments are not automatically acceptance commands. They must never
  # cancel a main-push acceptance before the owner-commanded job guard runs.
  group: ${{ github.event_name == 'issue_comment' && format('deployed-owner-comment-{0}', github.run_id) || 'deployed-owner-acceptance-main' }}
  cancel-in-progress: true
jobs:
  deployed-owner-acceptance:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.number == 396 &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.login == github.repository_owner &&
        startsWith(github.event.comment.body, '/startak accept-production ')))
    runs-on: ubuntu-24.04
    # Exact image matches package-lock Playwright 1.62.1; avoids unreliable apt --with-deps.
    # Image index digest from Microsoft's official Playwright registry, not a floating tag.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 25
    env:
      STARTAK_SOURCE_COMMIT: ${{ github.sha }}
      STARTAK_E2E_URL: https://startak-real-estate.pages.dev
    steps:
      - name: Bind owner-commanded acceptance to exact current main
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          ACCEPTANCE_COMMENT: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$COMMENT_ACTOR" == "$REPOSITORY_OWNER" ]] || { echo 'Acceptance restricted to repository owner'; exit 1; }
          [[ "$ACCEPTANCE_COMMENT" =~ ^/startak[[:space:]]accept-production[[:space:]]([a-fA-F0-9]{40})[[:space:]]*$ ]] || { echo 'Malformed exact-SHA acceptance command'; exit 1; }
          requested="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')"
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$requested" == "$GITHUB_SHA" && "$requested" == "$current_main" ]] || { echo 'Acceptance request does not match exact current main'; exit 1; }
          echo "OWNER_PUBLIC_ACCEPTANCE_AUTHORIZED=PASS sha=$requested"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Bind verification source to main
        run: test "$(git rev-parse HEAD)" = "$STARTAK_SOURCE_COMMIT"
      - run: npm ci
      - name: Verify pinned Playwright browsers without live apt downloads
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const pkg=require('playwright/package.json');
          const {chromium,firefox,webkit}=require('playwright');
          if(pkg.version!=='1.62.1')throw Error('PLAYWRIGHT_IMAGE_PACKAGE_VERSION_MISMATCH');
          for(const [kind,engine] of Object.entries({chromium,firefox,webkit})){
            const binary=engine.executablePath();
            if(!fs.existsSync(binary))throw Error('PLAYWRIGHT_PINNED_BROWSER_NOT_FOUND_'+kind.toUpperCase());
          }
          console.log('PLAYWRIGHT_PINNED_BROWSERS=PASS');
          JS
      - name: Require the exact reviewed commit on the public deployment
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const expected=process.env.STARTAK_SOURCE_COMMIT;
          if(!/^[a-f0-9]{40}$/.test(expected))throw new Error('Exact source SHA missing');
          let observed=null;
          for(let attempt=0;attempt<36;attempt++){
            try{
              const response=await fetch(process.env.STARTAK_E2E_URL+'/release-manifest.json?audit='+expected,{signal:AbortSignal.timeout(10000),headers:{'cache-control':'no-cache'}});
              if(!response.ok)throw new Error('Manifest HTTP '+response.status);
              observed=await response.json();
              if(observed.sourceCommit===expected&&observed.sourceCommitBound===true){
                if(!/(?:^|,)\s*no-store\s*(?:,|$)/i.test(response.headers.get('cache-control')||''))throw new Error('Release manifest permits storage');
                const documentResponse=await fetch(process.env.STARTAK_E2E_URL+'/',{signal:AbortSignal.timeout(10000)});
                if(!documentResponse.ok)throw new Error('Entry document HTTP '+documentResponse.status);
                if(!/(?:^|,)\s*no-store\s*(?:,|$)/i.test(documentResponse.headers.get('cache-control')||''))throw new Error('Entry document permits storage');
                const html=await documentResponse.text();
                const meta=html.match(/<meta\s+name="startak-source-commit"\s+content="([a-f0-9]{40})"\s*\/?\s*>/);
                if(meta?.[1]!==expected)throw new Error('Entry document does not match reviewed source');
                await fs.mkdir('runtime-evidence/remaining-audit',{recursive:true});
                await fs.writeFile('runtime-evidence/remaining-audit/deployed-manifest.json',JSON.stringify({expectedSourceCommit:expected,documentSourceCommit:meta[1],documentCacheControl:documentResponse.headers.get('cache-control'),observedManifest:observed,checkedAt:new Date().toISOString(),deploymentReadOnly:true,transactionAuthorized:false},null,2));
                console.log('DEPLOYED_OWNER_SOURCE=PASS sha='+expected);
                process.exit(0);
              }
            }catch(e){console.log('Deployment not ready: '+e.message);}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          throw new Error('Public deployment does not match reviewed main: '+JSON.stringify(observed));
          JS
      - name: Verify every compiled asset byte and missing-asset status
        run: node tools/verify-deployed-assets.mjs --url "$STARTAK_E2E_URL" --expected-sha "$STARTAK_SOURCE_COMMIT" --output runtime-evidence/remaining-audit/deployed-assets.json
      - name: Published source-linked native PDF and actual OCR tables
        run: node tests/e2e/run_audit_20261021_document_tables_browser.js
      - name: Published owner study and draft persistence
        run: node tests/e2e/run_audit_20261010_f03_f07_browser.js
      - name: Published financial export compatibility
        run: node tests/e2e/run_c75_real_chromium_personal_study.js
      - name: Published actual limited-property-rights DCF backup, tamper, and sector-isolation acceptance
        run: node tests/e2e/run_personal_limited_interest_archive_browser.js
      - name: Published actual month-scheduled land development DCF and rights/discount refusals
        run: node tests/e2e/run_personal_phased_development_browser.js
      - name: Published lease lifecycle, retained terms and saved report acceptance
        env:
          STARTAK_LEASE_VISUAL_PREVIEW: '1'
        run: node tests/e2e/run_audit_20261020_lease_lifecycle_browser.js
      - name: Published durable local recovery and persistent startup write block
        run: node tests/e2e/run_audit_20261021_durable_recovery_browser.js
      - name: Published backup transfer, rollback and concurrent restore
        run: node tests/e2e/run_audit_20261020_backup_browser.js
      - name: Published actual owned Chromium process kills during mutations and recovery
        run: node tests/e2e/run_audit_20261021_process_crash_browser.js
      - name: Published PDF worker, source journals, actions and three-browser print acceptance
        run: node tests/e2e/run_audit_20261010_remaining_browser.js
      - name: Published local Arabic/English OCR and worker lifecycle
        run: node tests/e2e/run_audit_20261020_local_ocr_browser.js
      - name: Save deployment-correlated browser and print evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployed-owner-acceptance-${{ github.sha }}
          path: runtime-evidence/remaining-audit
          if-no-files-found: error
