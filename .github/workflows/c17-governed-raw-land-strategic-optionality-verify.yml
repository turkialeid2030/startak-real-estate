name: C17 Governed Raw Land Strategic Optionality Verify

on:
  pull_request:
    paths:
      - 'src/strategy/governed-raw-land-strategic-optionality.js'
      - 'tests/defects/c17_governed_raw_land_strategic_optionality.js'
      - 'docs/capabilities/C17_GOVERNED_RAW_LAND_STRATEGIC_OPTIONALITY.md'
      - '.github/workflows/c17-governed-raw-land-strategic-optionality-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C17 governed raw land strategic optionality regression
        run: node tests/defects/c17_governed_raw_land_strategic_optionality.js
      - name: C16 governed auction acquisition regression
        run: node tests/defects/c16_governed_auction_acquisition.js
      - name: Canonical release verification
        run: npm run release:verify
