name: STARTAK RE C48 Provider Safety Requalification
on:
  pull_request:
    paths:
      - 'src/ai/provider-production-readiness.js'
      - 'tests/ai/run_c48_internal_ai_provider_production_readiness.js'
      - 'release/evidence/c48-internal-ai-provider-production-readiness.json'
      - 'docs/C48_INTERNAL_AI_PROVIDER_PRODUCTION_READINESS.md'
      - '.github/workflows/c48-internal-ai-provider-production-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: C48 original readiness contract (current-source requalification)
        run: node tests/ai/run_c48_internal_ai_provider_production_readiness.js
      - name: C22 C23 source-grounding adversarial requalification
        run: |
          node tests/defects/c22_governed_generative_intelligence.js
          node tests/defects/c23_governed_live_ai_provider_gateway.js
      - name: Latest AI candidate safety constraints
        run: node tests/defects/startak_re_ai_model_candidates_20261112.js
      - name: Canonical package / release regression
        run: npm run release:verify
      - name: C48 bounded readiness posture
        run: |
          echo 'C48_INTERNAL_AI_PROVIDER_PRODUCTION_READINESS=PASS'
          echo 'C48_READY_FOR_INDEPENDENT_PROVIDER_AUTHORIZATION_REVIEW=PASS'
          echo 'C48_GATE_547_SATISFIED=FALSE'
          echo 'C48_PUBLIC_AI_AUTHORIZED=FALSE'
          echo 'C48_PRODUCTION_INVOCATION_AUTHORIZED=FALSE'
          echo 'C48_DEPLOYMENT_AUTHORIZED=FALSE'
          echo 'C48_COMMERCIAL_GO_LIVE_AUTHORIZED=FALSE'
