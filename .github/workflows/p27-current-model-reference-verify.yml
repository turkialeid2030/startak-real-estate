name: P27 Current Model Reference Corpus Verify

on:
  pull_request:
    paths:
      - 'src/engines/**'
      - 'src/assumptions/**'
      - 'tests/defects/current_model_reference_corpus_p27_v2.js'
      - 'tests/reference/current-model-reference-v1.json'
      - 'tests/characterization/fixtures/RE-GOLD-*.json'
      - '.github/workflows/p27-current-model-reference-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Independent 4-case model reference
        run: node tests/defects/current_model_reference_corpus_p27_v2.js
      - name: Canonical full release regression
        run: npm run release:verify
