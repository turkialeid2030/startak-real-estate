name: P22 One-Shot UI Patch

on:
  push:
    branches:
      - p22-building-exit-cost-governance
    paths:
      - tools/p22_patch_app.py
      - .github/workflows/p22-one-shot-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: p22-building-exit-cost-governance
          fetch-depth: 0
      - name: Apply governed P22 UI patch
        run: python3 tools/p22_patch_app.py
      - name: Commit patched source
        run: |
          if git diff --quiet -- src/app/App.jsx tests/e2e/run_runtime_e2e_ci.mjs; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.jsx tests/e2e/run_runtime_e2e_ci.mjs
          git commit -m "P22: wire explicit building exit-cost input into production UI"
          git push origin HEAD:p22-building-exit-cost-governance
