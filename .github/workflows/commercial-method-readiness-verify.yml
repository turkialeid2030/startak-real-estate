name: Commercial Method Readiness Verify

on:
  pull_request:
    paths:
      - 'src/commercial/commercial-method-readiness.js'
      - 'tests/architecture/run_wave13b_commercial_method_readiness.js'
      - 'docs/WAVE_13B_COMMERCIAL_METHOD_READINESS.md'
      - '.github/workflows/commercial-method-readiness-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 13B commercial method readiness
        run: node tests/architecture/run_wave13b_commercial_method_readiness.js
      - name: Canonical release verification
        run: npm run release:verify
