name: Heritage Constraints Verify

on:
  pull_request:
    paths:
      - 'src/specialized-assets/heritage-constraints.js'
      - 'tests/architecture/run_wave14d_heritage_constraints.js'
      - 'docs/WAVE_14D_HERITAGE_CONSTRAINTS.md'
      - '.github/workflows/heritage-constraints-verify.yml'
      - 'src/specialized-assets/specialized-asset-evidence.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 14D heritage constraints
        run: node tests/architecture/run_wave14d_heritage_constraints.js
      - name: Canonical release verification
        run: npm run release:verify
