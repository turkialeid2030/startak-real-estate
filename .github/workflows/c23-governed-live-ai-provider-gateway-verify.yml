name: C23 Governed Live AI Provider Gateway Verify

on:
  pull_request:
    paths:
      - 'src/ai/governed-live-provider-gateway.js'
      - 'src/ai/proof-grounded-ai-runtime.js'
      - 'tests/defects/c23_governed_live_ai_provider_gateway.js'
      - 'docs/capabilities/C23_GOVERNED_LIVE_AI_PROVIDER_GATEWAY.md'
      - '.github/workflows/c23-governed-live-ai-provider-gateway-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C23 proof-grounded provider gateway adversarial regression
        run: node tests/defects/c23_governed_live_ai_provider_gateway.js
      - name: C22 governed generative intelligence adversarial regression
        run: node tests/defects/c22_governed_generative_intelligence.js
      - name: Canonical release verification
        run: npm run release:verify
