name: C22 Governed Generative Intelligence Verify

on:
  pull_request:
    paths:
      - 'src/ai/governed-generative-intelligence.js'
      - 'tests/defects/c22_governed_generative_intelligence.js'
      - 'docs/capabilities/C22_GOVERNED_GENERATIVE_INTELLIGENCE.md'
      - '.github/workflows/c22-governed-generative-intelligence-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C22 governed generative intelligence adversarial regression
        run: node tests/defects/c22_governed_generative_intelligence.js
      - name: C21 governed listing transparency amenity utility regression
        run: node tests/defects/c21_governed_listing_transparency_amenity_utility.js
      - name: Canonical release verification
        run: npm run release:verify
