name: Wave 17A Security Qualification Evidence Verify

on:
  pull_request:
    paths:
      - 'src/security/**'
      - 'tests/architecture/run_wave17a_security_qualification_evidence.js'
      - '.github/workflows/wave17a-security-qualification-evidence-verify.yml'
      - 'docs/WAVE_17A_SECURITY_QUALIFICATION_EVIDENCE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 17A security qualification evidence
        run: node tests/architecture/run_wave17a_security_qualification_evidence.js
      - name: Canonical release verification
        run: npm run release:verify
