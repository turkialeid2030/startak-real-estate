name: Owner Five-Step Staging Verify
on:
  push:
    branches:
      - feature/owner-five-step-wizard-staging-20261106
  pull_request:
    paths:
      - '.github/workflows/owner-five-step-staging-verify.yml'
      - 'src/components/OwnerFiveStepWizard.jsx'
      - 'src/components/LocalDepreciationReviewPanel.jsx'
      - 'src/components/LocalQuotedFinancingPanel.jsx'
      - 'src/components/LocalIncomeAssetReviewPanel.jsx'
      - 'src/components/LocalMarketIndicatorPanel.jsx'
      - 'src/components/LocalPolicyShockReviewPanel.jsx'
      - 'src/components/LocalUrbanGrowthReviewPanel.jsx'
      - 'src/components/LocalAssetEfficiencyPanel.jsx'
      - 'src/engines/financial/asset-efficiency-review.js'
      - 'tests/defects/asset_efficiency_four_axis.js'
      - 'tests/e2e/run_asset_efficiency_browser.js'
      - 'src/geospatial/urban-growth-accessibility-review*.js'
      - 'src/geospatial/local-urban-growth-review.js'
      - 'src/geospatial/encrypted-urban-growth-draft.js'
      - 'tests/defects/encrypted_urban_growth_saved_deal.js'
      - 'tests/e2e/run_urban_growth_review_browser.js'
      - 'tests/fixtures/synthetic-urban-growth.js'
      - 'tests/defects/urban_growth_accessibility_legacy_parity.js'
      - 'src/market/comparable-evidence*.js'
      - 'src/market/policy-shock-scenario-review*.js'
      - 'src/market/local-policy-shock-review.js'
      - 'src/market/encrypted-policy-shock-draft.js'
      - 'tests/defects/encrypted_policy_shock_saved_deal.js'
      - 'tests/e2e/run_policy_shock_review_browser.js'
      - 'tests/fixtures/synthetic-policy-shock.js'
      - 'tests/defects/policy_shock_scenario_legacy_parity.js'
      - 'src/market/market-indicator-policy-review*.js'
      - 'src/market/market-evidence-governance*.js'
      - 'src/market/local-market-indicator-review.js'
      - 'src/market/encrypted-market-indicator-draft.js'
      - 'tests/defects/encrypted_market_indicator_saved_deal.js'
      - 'tests/e2e/run_market_indicator_review_browser.js'
      - 'tests/fixtures/synthetic-market-indicators.js'
      - 'tests/defects/market_indicator_policy_legacy_parity.js'
      - 'src/income/**'
      - 'src/market/lease-income-evidence*.js'
      - 'tests/e2e/run_income_asset_review_browser.js'
      - 'tests/fixtures/synthetic-income-asset.js'
      - 'tests/defects/governed_income_asset_legacy_replay.js'
      - 'src/financing/**'
      - 'tests/e2e/run_quoted_financing_browser.js'
      - 'tests/fixtures/synthetic-quoted-financing.js'
      - 'tests/defects/quoted_financing_comparison_legacy_parity.js'
      - 'src/main.jsx'
      - 'src/cost/**'
      - 'src/engines/valuation/cost-approach*.js'
      - 'tests/e2e/run_component_depreciation_browser.js'
      - 'tests/fixtures/synthetic-component-depreciation.js'
      - 'tests/defects/component_depreciation_review_legacy_parity.js'
      - 'src/components/PropertyMarketLocationPanel.jsx'
      - 'src/components/LocalDocumentEvidenceIntakePanel.jsx'
      - 'src/components/LocalDocumentEvidenceWorkspace.jsx'
      - 'src/market/market-study-state.js'
      - 'src/market/supplemental-study-register.js'
      - 'tests/e2e/run_owner_five_step_staging.js'
      - 'tests/e2e/run_owner_canonical_mode_parity.js'
      - 'tests/e2e/run_owner_market_independent_evidence.js'
      - 'tests/e2e/run_audit_20261010_remaining_browser.js'
      - 'tests/e2e/run_audit_20261020_local_ocr_browser.js'
      - 'tools/private-golden-engine-replay.cjs'
      - 'tools/verify-owner-external-golden-17.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-five-step:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 60
    env:
      STARTAK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Verify exact tested commit
        run: test "$(git rev-parse HEAD)" = "$STARTAK_SOURCE_COMMIT"
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Canonical regression and release verification
        run: npm run release:verify
      - name: Synthetic current valuation module replay
        run: node tests/defects/private_golden_current_valuation_module_replay.js
      - name: Assert private golden-case gate fails closed without the authorized source
        shell: bash
        run: |
          set +e
          output=$(node tools/verify-owner-external-golden-17.mjs 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 2
          printf '%s\n' "$output" | grep -Fq 'STARTAK_PRIVATE_GOLDEN_SOURCE=BLOCKED_NOT_SUPPLIED'
      - name: Owner five-step browser acceptance and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/owner-five-step
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >runtime-evidence/owner-five-step/vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_owner_five_step_staging.js 2>&1 | tee runtime-evidence/owner-five-step/acceptance.log
          STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_owner_canonical_mode_parity.js 2>&1 | tee runtime-evidence/owner-five-step/parity.log
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_owner_market_independent_evidence.js 2>&1 | tee "runtime-evidence/owner-five-step/independent-evidence-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_component_depreciation_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/depreciation-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_quoted_financing_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/financing-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_income_asset_review_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/income-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_market_indicator_review_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/market-indicators-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_policy_shock_review_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/policy-shock-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_urban_growth_review_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/urban-growth-$browser.log"
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_asset_efficiency_browser.js 2>&1 | tee "runtime-evidence/owner-five-step/asset-efficiency-$browser.log"
          done
          STARTAK_E2E_URL=http://127.0.0.1:4173/?ownerView=advanced node tests/e2e/run_audit_20261010_remaining_browser.js 2>&1 | tee runtime-evidence/owner-five-step/legacy-diagnostics.log
          STARTAK_E2E_URL=http://127.0.0.1:4173/?ownerView=advanced node tests/e2e/run_audit_20261020_local_ocr_browser.js 2>&1 | tee runtime-evidence/owner-five-step/legacy-ocr.log
      - name: Upload evidence and mobile screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-five-step-staging-evidence
          path: runtime-evidence/owner-five-step
          if-no-files-found: warn
