name: Cloudflare Production Governance Control

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact trusted main SHA authorized for the control-plane mutation'
        required: true
        type: string
      confirm_control_plane_mutation:
        description: 'Type I_AUTHORIZE_GOVERNANCE_CONTROL_PLANE_MUTATION'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: cloudflare-production-governance-control
  cancel-in-progress: false

env:
  FROZEN_CANDIDATE_SOURCE_SHA: 21f51ad5b4c6787c556aa3b8528d9c3ec17f12c3
  SELECTED_RELEASE_ARTIFACT_SHA256: 6d0a43021a7758e9e83c026ada2c43b274b109146e5d078015505dfb3fea5bea
  CF_PROJECT_NAME: startak-real-estate
  CF_PRODUCTION_HOST: startak-real-estate.pages.dev
  ENVIRONMENT_REF: cloudflare-pages:startak-real-estate:production
  EVIDENCE_DIR: runtime-evidence/cloudflare-production-governance-control

jobs:
  control:
    name: cloudflare-production-governance-control
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 341 &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.user.login == github.repository_owner &&
          startsWith(github.event.comment.body, '/startak remediate-production-governance ')
        )
      }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Bind mutation to trusted main and explicit owner authorization
        shell: bash
        env:
          DISPATCH_EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha || '' }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirm_control_plane_mutation || '' }}
          OWNER_COMMAND_BODY: ${{ github.event.comment.body || '' }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              expected="$DISPATCH_EXPECTED_MAIN_SHA"
              [[ "$DISPATCH_CONFIRMATION" == 'I_AUTHORIZE_GOVERNANCE_CONTROL_PLANE_MUTATION' ]] || {
                echo 'Explicit control-plane mutation confirmation is missing or incorrect.'
                exit 1
              }
              ;;
            issue_comment)
              if [[ ! "$OWNER_COMMAND_BODY" =~ ^/startak[[:space:]]remediate-production-governance[[:space:]]([0-9a-fA-F]{40})$ ]]; then
                echo 'Owner command must be exactly: /startak remediate-production-governance <40-char-main-sha>'
                exit 1
              fi
              expected="${BASH_REMATCH[1]}"
              ;;
            *)
              echo "Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo "Mutation must run from main; got ${GITHUB_REF:-<none>}."; exit 1; }
          [[ "$expected" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Expected SHA must be 40 hex characters.'; exit 1; }
          [[ "${expected,,}" == "${GITHUB_SHA,,}" ]] || { echo "Expected main SHA mismatch: expected=$expected workflow=$GITHUB_SHA"; exit 1; }
          echo "Trusted governance-control main SHA: $GITHUB_SHA"

      - name: Preflight protected Cloudflare write access
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          token_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          jq -e '.success == true and .result.status == "active"' <<<"$token_json" >/dev/null
          echo 'Protected Cloudflare credential is active.'

      - name: Capture pre-mutation provider state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          project_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}")"
          jq -e '.success == true' <<<"$project_json" >/dev/null
          jq -e --arg name "$CF_PROJECT_NAME" '.result.name == $name and .result.production_branch == "main" and .result.source.type == "github"' <<<"$project_json" >/dev/null
          printf '%s' "$project_json" > /tmp/cf-project-before.json

          deployments_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?env=production&per_page=20")"
          jq -e '.success == true' <<<"$deployments_json" >/dev/null
          printf '%s' "$deployments_json" > /tmp/cf-deployments-before.json

          jq -S '.result.source | {
            type,
            config: {
              owner: .config.owner,
              owner_id: .config.owner_id,
              repo_name: .config.repo_name,
              repo_id: .config.repo_id,
              production_branch: .config.production_branch,
              production_deployments_enabled: .config.production_deployments_enabled,
              preview_deployment_setting: .config.preview_deployment_setting,
              preview_branch_includes: (.config.preview_branch_includes // []),
              preview_branch_excludes: (.config.preview_branch_excludes // []),
              path_includes: (.config.path_includes // []),
              path_excludes: (.config.path_excludes // []),
              pr_comments_enabled: .config.pr_comments_enabled
            }
          }' /tmp/cf-project-before.json > /tmp/source-before.json

          before_auto="$(jq -r '.result.source.config.production_deployments_enabled | if . == true then "true" elif . == false then "false" else "null" end' /tmp/cf-project-before.json)"
          before_fail_open="$(jq -r '.result.deployment_configs.production.fail_open | if . == true then "true" elif . == false then "false" else "null" end' /tmp/cf-project-before.json)"
          before_public_ai="$(jq -r '.result.deployment_configs.production.env_vars.RIAI_PUBLIC_AI_ENABLED.value // "<missing>"' /tmp/cf-project-before.json)"
          before_deployment_id="$(jq -r '(.result | map(select((.environment // "") == "production" and (.latest_stage.status // "") == "success")) | first.id) // empty' /tmp/cf-deployments-before.json)"
          test -n "$before_deployment_id" || { echo 'Could not identify current successful production deployment before mutation.'; exit 1; }
          [[ "$before_auto" != 'null' ]] || { echo 'Cloudflare did not expose production_deployments_enabled; fail closed.'; exit 1; }

          printf '%s' "$before_auto" > /tmp/before-auto
          printf '%s' "$before_fail_open" > /tmp/before-fail-open
          printf '%s' "$before_public_ai" > /tmp/before-public-ai
          printf '%s' "$before_deployment_id" > /tmp/before-deployment-id
          echo "Before: production_deployments_enabled=$before_auto fail_open=$before_fail_open public_ai=$before_public_ai deployment=$before_deployment_id"

      - name: Apply minimal fail-closed governance remediation
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          payload="$(jq -n '{
            source: {
              type: "github",
              config: {production_deployments_enabled: false}
            },
            deployment_configs: {
              production: {
                fail_open: false,
                env_vars: {
                  RIAI_PUBLIC_AI_ENABLED: {type: "plain_text", value: "false"}
                }
              }
            }
          }')"
          response="$(curl --fail-with-body --silent --show-error -X PATCH "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}" \
            --data "$payload")"
          jq -e '.success == true' <<<"$response" >/dev/null
          echo 'Requested governance remediation was accepted by Cloudflare.'

      - name: Verify exact post-mutation provider state and no deployment execution
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          sleep 2
          project_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}")"
          jq -e '.success == true' <<<"$project_json" >/dev/null
          printf '%s' "$project_json" > /tmp/cf-project-after.json

          jq -e '.result.source.config.production_deployments_enabled == false' /tmp/cf-project-after.json >/dev/null || {
            echo 'production_deployments_enabled was not disabled.'; exit 1;
          }
          jq -e '.result.deployment_configs.production.fail_open == false' /tmp/cf-project-after.json >/dev/null || {
            echo 'production fail_open was not set false.'; exit 1;
          }
          jq -e '.result.deployment_configs.production.env_vars.RIAI_PUBLIC_AI_ENABLED.value == "false"' /tmp/cf-project-after.json >/dev/null || {
            echo 'RIAI_PUBLIC_AI_ENABLED was not set false in provider configuration.'; exit 1;
          }

          jq -S '.result.source | {
            type,
            config: {
              owner: .config.owner,
              owner_id: .config.owner_id,
              repo_name: .config.repo_name,
              repo_id: .config.repo_id,
              production_branch: .config.production_branch,
              preview_deployment_setting: .config.preview_deployment_setting,
              preview_branch_includes: (.config.preview_branch_includes // []),
              preview_branch_excludes: (.config.preview_branch_excludes // []),
              path_includes: (.config.path_includes // []),
              path_excludes: (.config.path_excludes // []),
              pr_comments_enabled: .config.pr_comments_enabled
            }
          }' /tmp/cf-project-before.json > /tmp/source-before-stable.json
          jq -S '.result.source | {
            type,
            config: {
              owner: .config.owner,
              owner_id: .config.owner_id,
              repo_name: .config.repo_name,
              repo_id: .config.repo_id,
              production_branch: .config.production_branch,
              preview_deployment_setting: .config.preview_deployment_setting,
              preview_branch_includes: (.config.preview_branch_includes // []),
              preview_branch_excludes: (.config.preview_branch_excludes // []),
              path_includes: (.config.path_includes // []),
              path_excludes: (.config.path_excludes // []),
              pr_comments_enabled: .config.pr_comments_enabled
            }
          }' /tmp/cf-project-after.json > /tmp/source-after-stable.json
          cmp -s /tmp/source-before-stable.json /tmp/source-after-stable.json || {
            echo 'Unexpected source-control fields changed during remediation.'
            diff -u /tmp/source-before-stable.json /tmp/source-after-stable.json || true
            exit 1
          }

          deployments_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?env=production&per_page=20")"
          jq -e '.success == true' <<<"$deployments_json" >/dev/null
          after_deployment_id="$(jq -r '(.result | map(select((.environment // "") == "production" and (.latest_stage.status // "") == "success")) | first.id) // empty' <<<"$deployments_json")"
          before_deployment_id="$(cat /tmp/before-deployment-id)"
          [[ "$after_deployment_id" == "$before_deployment_id" ]] || {
            echo "Unexpected production deployment changed during control-plane remediation: before=$before_deployment_id after=$after_deployment_id"
            exit 1
          }
          printf '%s' "$after_deployment_id" > /tmp/after-deployment-id
          echo "Verified: automatic production deployments disabled, provider runtime configured fail-closed, and no deployment was executed."

      - name: Probe current public runtime without treating it as configuration authority
        shell: bash
        run: |
          set -euo pipefail
          base="https://${CF_PRODUCTION_HOST}"
          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' "$base/api/riai/public-config")"
          test "$status" = '200' || { echo "Public config returned HTTP $status"; rm -f "$body"; exit 1; }
          runtime_public_ai="$(jq -r 'if .publicAiEnabled == true then "true" else "false" end' "$body")"
          restricted="$(jq -r 'if has("turnstileSecret") or has("providerKey") or has("providerUrl") or has("model") then "true" else "false" end' "$body")"
          turnstile="$(jq -r 'if (.turnstileSiteKey | type == "string" and length > 10) then "true" else "false" end' "$body")"
          rm -f "$body"
          printf '%s' "$runtime_public_ai" > /tmp/runtime-public-ai
          printf '%s' "$restricted" > /tmp/runtime-restricted
          printf '%s' "$turnstile" > /tmp/runtime-turnstile
          echo "Observed current runtime public AI enabled: $runtime_public_ai"

      - name: Build auditable governance-control evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          account_sha="$(printf '%s' "$CF_ACCOUNT_ID" | sha256sum | awk '{print $1}')"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          before_auto="$(cat /tmp/before-auto)"
          before_fail_open="$(cat /tmp/before-fail-open)"
          before_public_ai="$(cat /tmp/before-public-ai)"
          runtime_public_ai="$(cat /tmp/runtime-public-ai)"
          before_deployment_id="$(cat /tmp/before-deployment-id)"
          after_deployment_id="$(cat /tmp/after-deployment-id)"

          jq -S -n \
            --arg frozenCandidateSourceSha "$FROZEN_CANDIDATE_SOURCE_SHA" \
            --arg selectedReleaseArtifactSha256 "$SELECTED_RELEASE_ARTIFACT_SHA256" \
            --arg environmentRef "$ENVIRONMENT_REF" \
            --arg accountIdSha256 "$account_sha" \
            --arg trustedControlMainSha "$GITHUB_SHA" \
            --arg triggerEvent "$GITHUB_EVENT_NAME" \
            --arg triggerActor "$GITHUB_ACTOR" \
            --arg beforeAuto "$before_auto" \
            --arg beforeFailOpen "$before_fail_open" \
            --arg beforePublicAi "$before_public_ai" \
            --arg runtimePublicAi "$runtime_public_ai" \
            --arg beforeDeploymentId "$before_deployment_id" \
            --arg afterDeploymentId "$after_deployment_id" \
            --arg generatedAt "$generated_at" \
            '{
              schemaVersion: 1,
              evidenceType: "CLOUDFLARE_PRODUCTION_GOVERNANCE_CONTROL_REMEDIATION",
              frozenReleaseContext: {
                candidateSourceSha: $frozenCandidateSourceSha,
                selectedArtifactSha256: $selectedReleaseArtifactSha256,
                environmentRef: $environmentRef
              },
              providerAccountIdSha256: $accountIdSha256,
              before: {
                productionDeploymentsEnabled: ($beforeAuto == "true"),
                failOpen: (if $beforeFailOpen == "null" then null else ($beforeFailOpen == "true") end),
                publicAiConfiguredValue: $beforePublicAi,
                productionDeploymentId: $beforeDeploymentId
              },
              after: {
                productionDeploymentsEnabled: false,
                failOpen: false,
                publicAiConfiguredValue: "false",
                productionDeploymentId: $afterDeploymentId,
                deploymentIdUnchanged: ($beforeDeploymentId == $afterDeploymentId),
                observedCurrentRuntimePublicAiEnabled: ($runtimePublicAi == "true"),
                futureAuthorizedDeploymentRequiredToGuaranteeRuntimeMatchesProviderConfig: ($runtimePublicAi == "true")
              },
              provenance: {
                trustedControlMainSha: $trustedControlMainSha,
                triggerEvent: $triggerEvent,
                triggerActor: $triggerActor,
                protectedEnvironment: "production",
                providerMutationPerformed: true
              },
              authority: {
                controlPlaneRemediationAuthorized: true,
                releaseAuthorized: false,
                applicationMergeAuthorized: false,
                applicationDeploymentAuthorized: false,
                goLiveAuthorized: false,
                transactionAuthorized: false,
                canonicalBaselineActivated: false
              },
              evidenceBoundary: "AUTHORIZED_CONTROL_PLANE_REMEDIATION_NOT_APPLICATION_DEPLOYMENT_OR_GO_LIVE_AUTHORITY",
              generatedAt: $generatedAt
            }' > "$EVIDENCE_DIR/governance-control-remediation.json"

          evidence_sha="$(sha256sum "$EVIDENCE_DIR/governance-control-remediation.json" | awk '{print $1}')"
          printf '%s  %s\n' "$evidence_sha" 'governance-control-remediation.json' > "$EVIDENCE_DIR/governance-control-remediation.sha256"
          echo "GOVERNANCE_CONTROL_EVIDENCE_SHA256=$evidence_sha"

      - name: Upload governance-control evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloudflare-production-governance-control
          path: runtime-evidence/cloudflare-production-governance-control
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish safety summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Cloudflare Production Governance Control'
            echo
            echo '- Automatic production branch deployment control was targeted fail-closed.'
            echo '- Production fail_open was targeted false.'
            echo '- RIAI_PUBLIC_AI_ENABLED provider configuration was targeted false.'
            if [[ -f /tmp/before-deployment-id && -f /tmp/after-deployment-id ]]; then
              echo "- Production deployment ID before: \`$(cat /tmp/before-deployment-id)\`"
              echo "- Production deployment ID after:  \`$(cat /tmp/after-deployment-id)\`"
            fi
            if [[ -f /tmp/runtime-public-ai ]]; then
              echo "- Current public runtime AI enabled observed after provider config mutation: \`$(cat /tmp/runtime-public-ai)\`"
            fi
            echo '- No application deployment, release authorization, canonical activation, Go-Live, or transaction authority is granted.'
          } >> "$GITHUB_STEP_SUMMARY"
