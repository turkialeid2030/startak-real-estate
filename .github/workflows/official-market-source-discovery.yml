name: Official Market Source Discovery
on:
  pull_request:
    paths:
      - 'tools/discover-official-market-sources.js'
      - 'docs/reporting/official-market-source-catalog.json'
      - 'tests/defects/official_market_discovery.js'
      - '.github/workflows/official-market-source-discovery.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 2 * * *'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Verify discovery guards
        run: node tests/defects/official_market_discovery.js
      - name: Discover and probe official sources independently
        run: node tools/discover-official-market-sources.js
      - name: Preserve evidence manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-market-discovery-${{ github.run_id }}
          path: runtime-evidence/official-market-discovery
          retention-days: 90
          if-no-files-found: warn
