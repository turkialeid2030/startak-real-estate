name: E2 Saudi Legal Professional Applicability Verify

on:
  pull_request:
    paths:
      - 'governance/saudi-legal-professional-applicability-candidates-2026-09-08.json'
      - 'src/standards/saudi-legal-professional-applicability.js'
      - 'tests/architecture/run_e2_saudi_legal_professional_applicability.js'
      - 'docs/E2_SAUDI_LEGAL_PROFESSIONAL_APPLICABILITY_2026-09-08.md'
      - '.github/workflows/e2-saudi-legal-professional-applicability-verify.yml'
      - 'governance/source-evidence-convergence-manifest-2026-09-08.json'
      - 'governance/official-valuation-standards-source-evidence-2026-09-08.json'
      - 'governance/official-saudi-regulatory-source-evidence-2026-09-08.json'
      - 'governance/saudi-regulatory-context-source-evidence-2026-09-08.json'
      - 'governance/official-standards-and-licensing-source-evidence-phase2-2026-09-08.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify E2 Saudi legal and professional applicability review gate
        run: node tests/architecture/run_e2_saudi_legal_professional_applicability.js
      - name: Re-verify source evidence convergence
        run: node tests/architecture/run_source_evidence_convergence.js
      - name: Canonical release verification
        run: npm run release:verify
