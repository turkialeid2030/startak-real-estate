name: Wave 17A Security Qualification Verify

on:
  pull_request:
    paths:
      - 'src/security/**'
      - 'tests/architecture/run_wave17a_security_qualification.js'
      - '.github/workflows/wave17a-security-qualification-verify.yml'
      - 'docs/WAVE_17A_SECURITY_QUALIFICATION.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 17A security qualification architecture checks
        run: node tests/architecture/run_wave17a_security_qualification.js
      - name: Canonical release verification
        run: npm run release:verify
