name: Professional Report Contract Verify

on:
  pull_request:
    paths:
      - 'src/reporting/**'
      - 'tests/architecture/run_wave15a_professional_report_contract.js'
      - 'docs/WAVE_15A_PROFESSIONAL_REPORT_CONTRACT.md'
      - '.github/workflows/professional-report-contract-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 15A report contract regression
        run: node tests/architecture/run_wave15a_professional_report_contract.js
      - name: Canonical release verification
        run: npm run release:verify
