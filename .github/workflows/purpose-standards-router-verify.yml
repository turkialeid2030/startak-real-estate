name: Purpose Standards Router Verify

on:
  pull_request:
    paths:
      - 'src/standards/purpose-based-standards-router.js'
      - 'tests/architecture/run_purpose_standards_router_v1.js'
      - 'docs/WAVE_7B_PURPOSE_STANDARDS_ROUTER.md'
      - '.github/workflows/purpose-standards-router-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wave 7B purpose standards router
        run: node tests/architecture/run_purpose_standards_router_v1.js

      - name: Canonical release verification
        run: npm run release:verify
