name: Professional Income NOI Verify

on:
  pull_request:
    paths:
      - 'src/income/**'
      - 'src/engines/valuation/professional-income-noi.js'
      - 'tests/architecture/run_wave12a_professional_income_noi.js'
      - 'docs/WAVE_12A_PROFESSIONAL_INCOME_NOI.md'
      - '.github/workflows/professional-income-noi-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 12A professional income and NOI
        run: node tests/architecture/run_wave12a_professional_income_noi.js
      - name: Canonical release verification
        run: npm run release:verify
