name: Whole-Property Sales Comparison Verify

on:
  pull_request:
    paths:
      - 'src/contracts/whole-property-sales-comparison.js'
      - 'src/valuation/whole-property-sales-comparison-input.js'
      - 'src/valuation/sandbox-whole-property-sales-comparison-draft.js'
      - 'src/engines/valuation/whole-property-sales-comparison.js'
      - 'tests/defects/c3m_whole_property_market_sales_comparison_foundation.js'
      - 'tests/defects/c3m_sandbox_whole_property_sales_comparison_draft.js'
      - '.github/workflows/whole-property-sales-comparison-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C3M governed whole-property sales comparison foundation
        run: node tests/defects/c3m_whole_property_market_sales_comparison_foundation.js
      - name: C3M sandbox whole-property sales comparison draft
        run: node tests/defects/c3m_sandbox_whole_property_sales_comparison_draft.js
      - name: Canonical release verification
        run: npm run release:verify
