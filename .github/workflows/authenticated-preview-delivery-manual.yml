name: Authorized Cloudflare Preview Delivery Audit
on:
  # Unprivileged pre-merge tests: no secrets, no service-auth access.
  pull_request:
    paths:
      - 'tools/verify-protected-preview.mjs'
      - 'tests/architecture/run_protected_preview_access.js'
      - '.github/workflows/authenticated-preview-delivery-manual.yml'
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Required: actual approved preview origin from Cloudflare Deployments (ending in /)'
        required: true
        type: string
        # No default: administrator must paste the exact immutable/approved deployment URL.
      source_sha:
        description: 'Required: exact 40-character candidate commit from verified Cloudflare deployment'
        required: true
        type: string
        # No default: administrator must match this SHA to the selected deployment.

# SECURITY: This workflow MUST run only from the reviewed main branch.
# Never expose Access secrets to pull_request, pull_request_target or PR head code.
# An admin must configure the protected startak-preview-audit Environment:
# allow main branch only; require reviewers; store credentials in environment secrets.
permissions:
  contents: read
concurrency:
  group: startak-authorized-preview-audit
  cancel-in-progress: false
jobs:
  preview-audit-selftest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # No Cloudflare secrets or protected environment in pull_request jobs.
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Execute synthetic scoped Access tests (no real token)
        run: node tests/architecture/run_protected_preview_access.js
      # Existing release-verify.yml independently runs the canonical release
      # gate on each pull_request SHA. Do not run a duplicate long regression
      # here: preserve the isolated, secret-free 43-check Access self-test.
      # Review BOTH check results on the exact same commit before merge.
  verify-approved-preview:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: startak-preview-audit
    env:
      PREVIEW_URL: ${{ inputs.preview_url }}
      EXPECTED_SHA: ${{ inputs.source_sha }}
      STARTAK_CF_ACCESS_CLIENT_ID: ${{ secrets.STARTAK_CF_ACCESS_CLIENT_ID }}
      STARTAK_CF_ACCESS_CLIENT_SECRET: ${{ secrets.STARTAK_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout trusted, reviewed main (never PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: main
      - name: Setup Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Require non-empty protected identity and exact approved preview hostname
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STARTAK_CF_ACCESS_CLIENT_ID" || { echo 'ACCESS_CI_ID_NOT_CONFIGURED'; exit 1; }
          test -n "$STARTAK_CF_ACCESS_CLIENT_SECRET" || { echo 'ACCESS_CI_SECRET_NOT_CONFIGURED'; exit 1; }
          node --input-type=module - <<'NODE'
          import {validatedProtectedPreviewUrl} from './tools/verify-protected-preview.mjs';
          const url=validatedProtectedPreviewUrl(process.env.PREVIEW_URL);
          if(!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_SHA))throw Error('EXPECTED_SHA_INVALID');
          console.log('AUTHORIZED_PREVIEW_SCOPE=VALID urlHost='+new URL(url).hostname);
          NODE
      - name: Verify authenticated exact SHA, downloaded assets SHA256 and missing asset 404
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-protected-preview.mjs --url "$PREVIEW_URL" --expected-sha "$EXPECTED_SHA"
      - name: Do not grant commercial or professional GO
        run: echo 'PREVIEW_ASSET_INTEGRITY_IS_NOT_MARKET_ACCURACY_OR_RELEASE_AUTHORITY'
