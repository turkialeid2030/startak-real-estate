name: C2N Governed Non-API Source Acquisition Verify

on:
  pull_request:
    paths:
      - 'src/source-intelligence/source-provider-registry.js'
      - 'src/source-intelligence/governed-non-api-acquisition.js'
      - 'tests/defects/c2n_governed_non_api_source_acquisition.js'
      - 'docs/capabilities/C2N_GOVERNED_NON_API_SOURCE_ACQUISITION.md'
      - '.github/workflows/c2n-governed-non-api-source-acquisition-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C2N governed non-API acquisition regression
        run: node tests/defects/c2n_governed_non_api_source_acquisition.js
      - name: C2S source provenance regression
        run: node tests/defects/c2s_source_intelligence_evidence_provenance_registry.js
      - name: Canonical release verification
        run: npm run release:verify
