name: C2N Governed Non-API Source Acquisition Verify

on:
  pull_request:
    paths:
      - 'src/source-intelligence/source-provider-registry.js'
      - 'src/source-intelligence/governed-non-api-acquisition.js'
      - 'src/source-intelligence/private-alpha-acquisition-orchestrator.js'
      - 'src/release/private-alpha-operating-mode.js'
      - 'tests/defects/c2n_governed_non_api_source_acquisition.js'
      - 'tests/release/run_c51_private_alpha_governance_non_api_acquisition.js'
      - 'release/evidence/c51-private-alpha-governance-non-api-acquisition.json'
      - 'docs/capabilities/C2N_GOVERNED_NON_API_SOURCE_ACQUISITION.md'
      - 'docs/C51_PRIVATE_ALPHA_GOVERNANCE_NON_API_ACQUISITION.md'
      - '.github/workflows/c2n-governed-non-api-source-acquisition-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C51 private-alpha governance and non-API acquisition contract
        run: npm run test:c51:private-alpha
      - name: C2N governed non-API acquisition regression
        run: node tests/defects/c2n_governed_non_api_source_acquisition.js
      - name: C2S source provenance regression
        run: node tests/defects/c2s_source_intelligence_evidence_provenance_registry.js
      - name: Production build
        run: npm run build
      - name: Package verification
        run: npm run verify:package
      - name: Dependency audit
        run: npm audit --audit-level=low
      - name: Canonical release verification
        run: npm run release:verify
      - name: C51 bounded operating posture
        run: |
          echo 'C51_PRIVATE_ALPHA_GOVERNANCE=PASS'
          echo 'C51_NON_API_ACQUISITION_ORCHESTRATION=PASS'
          echo 'C51_API_REQUIRED=FALSE'
          echo 'C51_PRIVATE_ALPHA_DEPLOYMENT_ELIGIBLE=TRUE'
          echo 'C51_EXTERNAL_C30_GATES_BLOCK_PRIVATE_ALPHA=FALSE'
          echo 'C51_COMMERCIAL_GO_LIVE_AUTHORIZED=FALSE'
