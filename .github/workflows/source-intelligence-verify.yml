name: Source Intelligence Verify

on:
  pull_request:
    paths:
      - 'src/contracts/source-intelligence.js'
      - 'src/source-intelligence/**'
      - 'tests/defects/c2s_source_intelligence_evidence_provenance_registry.js'
      - 'docs/capabilities/C2S_SOURCE_INTELLIGENCE_EVIDENCE_PROVENANCE_REGISTRY.md'
      - '.github/workflows/source-intelligence-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C2S source intelligence and evidence provenance registry
        run: node tests/defects/c2s_source_intelligence_evidence_provenance_registry.js
      - name: Canonical release verification
        run: npm run release:verify
