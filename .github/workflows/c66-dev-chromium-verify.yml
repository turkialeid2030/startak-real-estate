name: C66 Watched Developer Preview Browser Recovery
on:
  pull_request:
    branches:
      - c64-land-development-live-chromium-20261008
    paths:
      - 'tools/startak-dev-stable.js'
      - 'package.json'
      - 'tests/e2e/run_c66_vite_development_boot.js'
      - '.github/workflows/c66-dev-chromium-verify.yml'
      - 'docs/C66_VITE_DEV_BOOTSTRAP.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Exact head identity
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start watched-built developer preview fallback (not native Vite HMR)
        run: |
          (nohup npm run dev:stable -- --host 127.0.0.1 --port 4174 --strictPort > /tmp/c66-vite-development.log 2>&1 &)
          for n in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/c66-vite-development.log
          exit 1
      - name: ACTUAL watched-bundle developer preview Chromium UI
        env:
          STARTAK_DEV_E2E_URL: http://127.0.0.1:4174
        run: |
          node tests/e2e/run_c66_vite_development_boot.js || {
            echo "=== C66 WATCHED DEVELOPMENT BUILD AND PREVIEW LOG ==="
            cat /tmp/c66-vite-development.log
            exit 1
          }
      - name: Build exact production application
        run: npm run build
      - name: Preserve financial and C64 boundary invariants
        run: |
          node tests/architecture/run_c64_land_institutional_hold.js
          node tests/architecture/run_c65_institutional_arabic_reasons.js
          node tests/architecture/run_c62_live_institutional_valuation_boundary.js
      - run: npm run verify:package
      - run: npm run release:verify
      - run: npm audit --audit-level=low
