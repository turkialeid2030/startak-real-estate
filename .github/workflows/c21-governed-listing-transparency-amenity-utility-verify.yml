name: C21 Governed Listing Transparency Amenity Utility Verify

on:
  pull_request:
    paths:
      - 'src/strategy/governed-listing-transparency-amenity-utility.js'
      - 'tests/defects/c21_governed_listing_transparency_amenity_utility.js'
      - 'docs/capabilities/C21_GOVERNED_LISTING_TRANSPARENCY_AMENITY_UTILITY.md'
      - '.github/workflows/c21-governed-listing-transparency-amenity-utility-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C21 governed listing transparency amenity utility regression
        run: node tests/defects/c21_governed_listing_transparency_amenity_utility.js
      - name: C20 governed urban growth accessibility regression
        run: node tests/defects/c20_governed_urban_growth_accessibility.js
      - name: Canonical release verification
        run: npm run release:verify
