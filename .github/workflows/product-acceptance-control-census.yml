name: Product Acceptance Control Census
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/run_product_control_census.js'
      - '.github/workflows/product-acceptance-control-census.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: startak-product-acceptance-control-census-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  census:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    timeout-minutes: 30
    env:
      STARTAK_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      STARTAK_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Bind exact source
        run: test "$(git rev-parse HEAD)" = "$STARTAK_SOURCE_COMMIT"
      - run: npm ci
      - run: npm run build
      - name: Inventory controls and navigation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/product-acceptance
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >runtime-evidence/product-acceptance/preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ -o /dev/null
          STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_product_control_census.js 2>&1 | tee runtime-evidence/product-acceptance/census.log
      - name: Retain inventory and screenshots (including failures)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: product-control-census-${{ matrix.browser }}
          path: runtime-evidence/product-acceptance
          if-no-files-found: error
