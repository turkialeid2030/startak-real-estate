name: Wave 17B Performance Resilience Verify

on:
  pull_request:
    paths:
      - 'src/qualification/performance-resilience.js'
      - 'tests/architecture/run_wave17b_performance_resilience.js'
      - '.github/workflows/wave17b-performance-resilience-verify.yml'
      - 'docs/WAVE_17B_PERFORMANCE_RESILIENCE.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 17B performance resilience checks
        run: node tests/architecture/run_wave17b_performance_resilience.js
      - name: Canonical release verification
        run: npm run release:verify
