name: C58 Comparable Provenance and Rights Integrity
on:
  pull_request:
    paths:
      - 'src/market/comparable-provenance-chain.js'
      - 'tests/architecture/run_c58_comparable_provenance_chain.js'
      - 'docs/C58_PROVENANCE_CHAIN_ENGINEERING.md'
      - 'docs/capabilities/C58_MODERN_COMPATIBILITY_20261111.md'
      - '.github/workflows/c58-comparable-provenance-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Assert exact SHA
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - run: npm ci
      - name: C58 provenance and authenticity boundary
        run: node tests/architecture/run_c58_comparable_provenance_chain.js
      - name: Assert C58 is not silently wired to public or canonical decision routes
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          for(const path of ['src/App.jsx','src/components/PropertyMarketLocationPanel.jsx']){
            if(!fs.existsSync(path)) continue;
            const source=fs.readFileSync(path,'utf8');
            if(source.includes("require('./market/comparable-provenance-chain')") ||
               source.includes("require('../market/comparable-provenance-chain')") ||
               source.includes("from './market/comparable-provenance-chain'"))
              throw Error('C58_UNREVIEWED_APP_ACTIVATION');
          }
          console.log('C58_NOT_PUBLICLY_ACTIVATED=PASS');
          NODE
      - name: Current Wave 9A / Wave 9B comparable regressions
        run: |
          node tests/architecture/run_wave9a_market_comparable_evidence.js
          node tests/architecture/run_wave9b_comparable_adjustments.js
      - run: npm run build
      - run: npm run verify:package
      - run: npm run release:verify
      - run: npm audit --audit-level=low
