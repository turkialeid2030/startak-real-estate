name: C50 Internal Human UAT Readiness

on:
  pull_request:
    branches:
      - c49-internal-official-source-data-rights-readiness
    paths:
      - 'package.json'
      - 'src/uat/human-uat-readiness.js'
      - 'tests/uat/run_c50_internal_human_uat_readiness.js'
      - 'release/evidence/c50-internal-human-uat-readiness.json'
      - 'docs/C50_INTERNAL_HUMAN_UAT_READINESS.md'
      - '.github/workflows/c50-internal-human-uat-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Assert exact pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "C50_EXACT_HEAD_ASSERTION=PASS sha=$ACTUAL_SHA"
      - name: Install locked dependencies
        run: npm ci
      - name: C50 human UAT readiness contract
        run: npm run test:c50:human-uat-readiness
      - name: C49 source-rights regression
        run: npm run test:c49:source-data-rights
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=low
      - name: Production build
        run: npm run build
      - name: Package verification
        run: npm run verify:package
      - name: Canonical release verification
        run: npm run release:verify
      - name: C50 bounded readiness posture
        run: |
          echo 'C50_INTERNAL_HUMAN_UAT_READINESS=PASS'
          echo 'C50_READY_FOR_INDEPENDENT_HUMAN_UAT=PASS'
          echo 'C50_GATE_549_SATISFIED=FALSE'
          echo 'C50_HUMAN_UAT_APPROVED=FALSE'
          echo 'C50_DEPLOYMENT_AUTHORIZED=FALSE'
          echo 'C50_COMMERCIAL_GO_LIVE_AUTHORIZED=FALSE'
          echo 'C50_FINAL_POSTURE=INTERNAL_HUMAN_UAT_READINESS_QUALIFIED_READY_FOR_INDEPENDENT_HUMAN_UAT_EXTERNAL_GATE_549_HOLD'
