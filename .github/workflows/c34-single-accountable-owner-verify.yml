name: C34 Single Accountable Owner Verify

on:
  pull_request:
    branches:
      - c33-evidence-request-outreach-handoff
    paths:
      - 'tools/c34-single-accountable-owner.js'
      - 'release/evidence/c34-single-accountable-owner-register.json'
      - 'tests/defects/c34_single_accountable_owner.js'
      - 'docs/release/C34_SINGLE_ACCOUNTABLE_OWNER.md'
      - '.github/workflows/c34-single-accountable-owner-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact C34 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact C34 head
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_HEAD_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: C34 single accountable owner regression
        run: node tests/defects/c34_single_accountable_owner.js

      - name: Validate current real accountability posture
        shell: bash
        run: |
          set -euo pipefail
          node tools/c34-single-accountable-owner.js | tee /tmp/c34.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/c34.json', 'utf8'));
          if (r.totalRequiredItems !== 13) throw new Error('C34_TOTAL_REQUIRED_ITEMS_INVALID');
          if (r.accountableOwnerAssignedCount !== 13) throw new Error('C34_OWNER_ASSIGNMENT_INCOMPLETE');
          if (r.evidenceSatisfiedCount !== 0) throw new Error('C34_FALSE_EVIDENCE_SATISFACTION');
          if (r.sentCount !== 0 || r.responseReceivedCount !== 0) throw new Error('C34_FALSE_ACTIVITY');
          if (r.programState !== 'SINGLE_ACCOUNTABLE_OWNER_ASSIGNED_REAL_EVIDENCE_REQUIRED') throw new Error('C34_REAL_STATE_CHANGED');
          for (const key of ['releaseDecisionAuthorized','canonicalBaselineActivationAuthorized','mergeAuthorized','deploymentAuthorized','commercialGoLiveAuthorized','transactionAuthority','approvalAuthorized','publicAiAuthorized']) {
            if (r[key] !== false) throw new Error(`C34_AUTHORITY_ESCALATION:${key}`);
          }
          console.log('C34_CURRENT_REAL_POSTURE=PASS');
          NODE

      - name: Canonical release verification
        run: npm run release:verify
