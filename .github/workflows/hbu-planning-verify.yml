name: HBU Planning Verify

on:
  pull_request:
    paths:
      - 'src/planning/**'
      - 'src/hbu/**'
      - 'tests/architecture/run_wave10a_hbu_planning.js'
      - 'docs/WAVE_10A_HBU_PLANNING.md'
      - '.github/workflows/hbu-planning-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 10A HBU and planning
        run: node tests/architecture/run_wave10a_hbu_planning.js
      - name: Canonical release verification
        run: npm run release:verify
