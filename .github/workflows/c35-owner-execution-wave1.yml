name: C35 Owner Execution Wave Verify

on:
  pull_request:
    branches:
      - c34-single-accountable-owner

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      C30_TARGET_SHA: 2f066168f6cdca672d668ff5367ab250fe5cb907
      C30_ROLLBACK_SHA: ba617ef387843b6916bb8da0bf08b16e0922260f
    steps:
      - name: Checkout exact C35 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact C35 head
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_HEAD_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: C35 owner execution regression
        run: node tests/defects/c35_owner_execution_plan.js

      - name: Validate current C35 execution posture
        shell: bash
        run: |
          set -euo pipefail
          node tools/c35-owner-execution-plan.js | tee /tmp/c35-plan.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/c35-plan.json', 'utf8'));
          if (r.totalRequiredItems !== 13) throw new Error('C35_TOTAL_REQUIRED_ITEMS_INVALID');
          if (r.accountableOwnerAssignedCount !== 13) throw new Error('C35_OWNER_ASSIGNMENT_INCOMPLETE');
          if (r.evidenceSatisfiedCount !== 0) throw new Error('C35_FALSE_EVIDENCE_SATISFACTION');
          if (r.executionScheduledCount !== 1) throw new Error('C35_ROLLBACK_NOT_SCHEDULED');
          for (const key of ['releaseDecisionAuthorized','canonicalBaselineActivationAuthorized','mergeAuthorized','deploymentAuthorized','commercialGoLiveAuthorized','transactionAuthority','approvalAuthorized','publicAiAuthorized']) {
            if (r[key] !== false) throw new Error(`C35_AUTHORITY_ESCALATION:${key}`);
          }
          console.log('C35_CURRENT_EXECUTION_POSTURE=PASS');
          NODE

      - name: Canonical release verification on C35 head
        run: npm run release:verify

      - name: Execute controlled C30 rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          C35_HEAD="$(git rev-parse HEAD)"
          REPORT="/tmp/c35-rollback-rehearsal.json"
          STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          git cat-file -e "${C30_TARGET_SHA}^{commit}"
          git cat-file -e "${C30_ROLLBACK_SHA}^{commit}"

          verify_stage() {
            local label="$1"
            local sha="$2"
            local start end
            echo "=== C35_ROLLBACK_STAGE:${label}:${sha} ==="
            git checkout --detach "$sha"
            test "$(git rev-parse HEAD)" = "$sha"
            rm -rf node_modules dist
            npm ci
            start="$(date +%s)"
            npm run build
            npm run release:verify
            end="$(date +%s)"
            echo $((end - start))
          }

          TARGET_VERIFY_SECONDS="$(verify_stage TARGET_BASELINE "$C30_TARGET_SHA" | tee /dev/stderr | tail -n 1)"
          ROLLBACK_VERIFY_SECONDS="$(verify_stage ROLLBACK_POINT "$C30_ROLLBACK_SHA" | tee /dev/stderr | tail -n 1)"
          RESTORE_VERIFY_SECONDS="$(verify_stage TARGET_RESTORE "$C30_TARGET_SHA" | tee /dev/stderr | tail -n 1)"

          COMPLETED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git checkout --detach "$C35_HEAD"
          test "$(git rev-parse HEAD)" = "$C35_HEAD"

          cat > "$REPORT" <<JSON
          {
            "schemaVersion": 1,
            "scope": "C35_CONTROLLED_NON_PRODUCTION_ROLLBACK_REHEARSAL",
            "executionResult": "EXECUTED_CANDIDATE_EVIDENCE_PENDING_INDEPENDENT_REVIEW",
            "environment": "github-actions:ubuntu-24.04:controlled-non-production-source-build-rehearsal",
            "c35ControlHeadSha": "$C35_HEAD",
            "targetCandidateSha": "$C30_TARGET_SHA",
            "rollbackPointSha": "$C30_ROLLBACK_SHA",
            "targetBaselineVerifySeconds": $TARGET_VERIFY_SECONDS,
            "rollbackVerifySeconds": $ROLLBACK_VERIFY_SECONDS,
            "targetRestoreVerifySeconds": $RESTORE_VERIFY_SECONDS,
            "startedAt": "$STARTED_AT",
            "completedAt": "$COMPLETED_AT",
            "targetBuildAndReleaseVerifyPassed": true,
            "rollbackBuildAndReleaseVerifyPassed": true,
            "targetRestoreBuildAndReleaseVerifyPassed": true,
            "independentReviewAccepted": false,
            "c30EvidenceStatusChanged": false,
            "releaseDecisionAuthorized": false,
            "mergeAuthorized": false,
            "deploymentAuthorized": false,
            "commercialGoLiveAuthorized": false,
            "transactionAuthority": false,
            "approvalAuthorized": false,
            "publicAiAuthorized": false
          }
          JSON

          REPORT_SHA256="$(sha256sum "$REPORT" | awk '{print $1}')"
          cat "$REPORT"
          echo "C35_ROLLBACK_REHEARSAL_REPORT_SHA256=$REPORT_SHA256"

          node - "$REPORT" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (r.executionResult !== 'EXECUTED_CANDIDATE_EVIDENCE_PENDING_INDEPENDENT_REVIEW') throw new Error('C35_ROLLBACK_RESULT_INVALID');
          if (!r.targetBuildAndReleaseVerifyPassed || !r.rollbackBuildAndReleaseVerifyPassed || !r.targetRestoreBuildAndReleaseVerifyPassed) throw new Error('C35_ROLLBACK_STAGE_FAILED');
          if (r.independentReviewAccepted !== false || r.c30EvidenceStatusChanged !== false) throw new Error('C35_ROLLBACK_FALSE_APPROVAL');
          for (const key of ['releaseDecisionAuthorized','mergeAuthorized','deploymentAuthorized','commercialGoLiveAuthorized','transactionAuthority','approvalAuthorized','publicAiAuthorized']) {
            if (r[key] !== false) throw new Error(`C35_ROLLBACK_AUTHORITY_ESCALATION:${key}`);
          }
          console.log('C35_ROLLBACK_REPORT_VALIDATION=PASS');
          NODE

          echo "C35_ROLLBACK_REHEARSAL=EXECUTED_CANDIDATE_EVIDENCE_PENDING_INDEPENDENT_REVIEW"
          echo "C35_ROLLBACK_FINAL_C30_GATE=NOT_SUPPLIED_PENDING_INDEPENDENT_REVIEW"
