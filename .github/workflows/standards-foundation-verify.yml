name: Standards Foundation Verify

on:
  pull_request:
    paths:
      - 'src/standards/**'
      - 'tests/architecture/run_standards_foundation_v1.js'
      - 'docs/WAVE_7A_STANDARDS_FOUNDATION.md'
      - 'docs/B3_STACK_DECISION.md'
      - '.github/workflows/standards-foundation-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wave 7A standards foundation
        run: node tests/architecture/run_standards_foundation_v1.js

      - name: Canonical release verification
        run: npm run release:verify
