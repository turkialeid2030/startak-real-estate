name: E2C External Authority Validation Verify

on:
  pull_request:
    paths:
      - 'governance/e2c-external-authority-validation-policy-2026-09-08.json'
      - 'src/standards/external-authority-validation.js'
      - 'tests/architecture/run_e2c_external_authority_validation.js'
      - 'docs/E2C_EXTERNAL_AUTHORITY_VALIDATION_2026-09-08.md'
      - '.github/workflows/e2c-external-authority-validation-verify.yml'
      - 'governance/e2b-external-review-evidence-requirements-2026-09-08.json'
      - 'src/standards/external-review-credential-evidence.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify E2C external authority validation gate
        run: node tests/architecture/run_e2c_external_authority_validation.js
      - name: Re-verify E2B evidence envelope
        run: node tests/architecture/run_e2b_external_review_credential_evidence.js
      - name: Canonical release verification
        run: npm run release:verify
