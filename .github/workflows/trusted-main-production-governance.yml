name: Trusted Main Production Governance

on:
  pull_request_target:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-main-production-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TRUSTED_VERIFIER_COMMIT_SHA: 952c1d33ae2e86887cd13a8186d39ad10dea0113

jobs:
  trusted-main-production-governance:
    name: trusted-main-production-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Reject untrusted pull-request provenance
        shell: bash
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPO" == "$BASE_REPO" ]] || {
            echo 'Main integration is restricted to same-repository branches.'
            exit 1
          }
          [[ "$BASE_REF" == 'main' ]] || {
            echo "Trusted governance only accepts pull requests targeting main; got ${BASE_REF:-<none>}."
            exit 1
          }

      - name: Checkout immutable trusted verifier implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TRUSTED_VERIFIER_COMMIT_SHA }}
          path: .trusted-verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable verifier identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C .trusted-verifier rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          expected="$(printf '%s' "$TRUSTED_VERIFIER_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" == "$expected" ]] || {
            echo "Trusted verifier checkout mismatch. expected=$expected actual=$actual"
            exit 1
          }
          [[ "$expected" =~ ^[a-f0-9]{40}$ ]] || {
            echo 'Pinned trusted verifier commit is malformed.'
            exit 1
          }
          echo "Trusted verifier identity confirmed at ${expected:0:12}."

      - name: Classify operating mode as inert data from exact PR head
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Malformed PR head SHA.'; exit 1; }
          api="https://api.github.com/repos/${REPOSITORY}/contents/governance/operator-templates/INTERNAL_USE_MODE.current.json?ref=${EXPECTED_HEAD_SHA}"
          status="$(curl --silent --show-error --location --output /tmp/internal-mode-response.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")"

          if [[ "$status" == '404' ]]; then
            echo 'mode=production' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$status" == '200' ]] || { echo "Internal-mode metadata fetch failed with HTTP ${status}."; exit 1; }

          node <<'NODE'
          const fs = require('fs');
          const response = JSON.parse(fs.readFileSync('/tmp/internal-mode-response.json', 'utf8'));
          if (response.type !== 'file' || response.encoding !== 'base64' || typeof response.content !== 'string') {
            throw new Error('Unexpected internal-mode metadata response.');
          }
          const raw = Buffer.from(response.content.replace(/\s/g, ''), 'base64').toString('utf8');
          const x = JSON.parse(raw);
          const required = {
            schemaVersion: 1,
            ownerDirection: 'INTERNAL_USE_EVALUATION_AND_CONTINUOUS_DEVELOPMENT',
            operatingMode: 'INTERNAL_EVALUATION_AND_CONTINUOUS_DEVELOPMENT',
            externalReviewRequiredForCurrentMode: false,
            e2bDispositionForCurrentMode: 'NOT_APPLICABLE_INTERNAL_USE',
            e2cDispositionForCurrentMode: 'NOT_APPLICABLE_INTERNAL_USE',
            externalProductionGovernanceChainDisposition: 'NOT_APPLICABLE_UNTIL_EXTERNAL_OR_REGULATED_USE',
            internalEngineeringContinuation: true,
            internalTestingAllowed: true,
            internalEvaluationAllowed: true,
            continuousDevelopmentAllowed: true,
            externalProfessionalCertification: false,
            transactionAuthority: false,
            externalCommercialGoLive: false
          };
          for (const [k, v] of Object.entries(required)) {
            if (x[k] !== v) throw new Error(`Unsafe or malformed internal-use declaration: ${k}`);
          }
          const triggers = new Set(x.reentryTriggers || []);
          for (const t of ['EXTERNAL_CLIENT_RELIANCE','PROFESSIONAL_OR_CERTIFIED_OUTPUT_CLAIM','TRANSACTION_AUTHORIZATION_OR_EXECUTION','BINDING_LEGAL_REGULATORY_CONTRACTUAL_LENDER_AUDITOR_OR_COURT_REQUIREMENT','OWNER_CHANGES_OPERATING_MODE']) {
            if (!triggers.has(t)) throw new Error(`Missing mandatory re-entry trigger: ${t}`);
          }
NODE
          echo 'mode=internal' >> "$GITHUB_OUTPUT"

      - name: Verify internal-use safety boundary
        if: steps.mode.outputs.mode == 'internal'
        shell: bash
        run: |
          set -euo pipefail
          echo 'Internal-use declaration was fetched as inert data for the exact PR head; PR-head code was not checked out or executed.'
          echo 'External professional certification: false.'
          echo 'Transaction authority: false.'
          echo 'External commercial Go-Live: false.'
          echo 'Production E2E/E2F/E2G signatures are not required for this internal-only integration.'

      - name: Verify real E2E, E2F and E2G production governance for exact PR head
        if: steps.mode.outputs.mode != 'internal'
        working-directory: .trusted-verifier
        env:
          STARTAK_E2E_PACKET_B64: ${{ secrets.STARTAK_E2E_PACKET_B64 }}
          STARTAK_E2E_PACKET_PIN_SHA256: ${{ secrets.STARTAK_E2E_PACKET_PIN_SHA256 }}
          STARTAK_E2F_PACKET_B64: ${{ secrets.STARTAK_E2F_PACKET_B64 }}
          STARTAK_E2F_PACKET_PIN_SHA256: ${{ secrets.STARTAK_E2F_PACKET_PIN_SHA256 }}
          STARTAK_E2F_VERIFIER_REGISTRY_B64: ${{ secrets.STARTAK_E2F_VERIFIER_REGISTRY_B64 }}
          STARTAK_E2F_VERIFIER_REGISTRY_PIN_SHA256: ${{ secrets.STARTAK_E2F_VERIFIER_REGISTRY_PIN_SHA256 }}
          STARTAK_E2G_PACKET_B64: ${{ secrets.STARTAK_E2G_PACKET_B64 }}
          STARTAK_E2G_PACKET_PIN_SHA256: ${{ secrets.STARTAK_E2G_PACKET_PIN_SHA256 }}
          STARTAK_E2G_RELEASE_AUTHORITY_REGISTRY_B64: ${{ secrets.STARTAK_E2G_RELEASE_AUTHORITY_REGISTRY_B64 }}
          STARTAK_E2G_RELEASE_AUTHORITY_REGISTRY_PIN_SHA256: ${{ secrets.STARTAK_E2G_RELEASE_AUTHORITY_REGISTRY_PIN_SHA256 }}
          STARTAK_EXPECTED_RELEASE_SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/main-merge-production-governance-gate.js

      - name: Record trusted governance result
        if: success()
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OPERATING_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          {
            echo '## Trusted Main Governance'
            echo
            echo "- PR: #${PR_NUMBER}"
            echo "- Authorized source commit: \`${PR_HEAD_SHA}\`"
            echo "- Main base commit: \`${PR_BASE_SHA}\`"
            echo "- Immutable verifier commit: \`${TRUSTED_VERIFIER_COMMIT_SHA}\`"
            echo "- Classified mode: \`${OPERATING_MODE}\`"
            if [[ "$OPERATING_MODE" == 'internal' ]]; then
              echo '- Internal evaluation/testing/development integration only.'
              echo '- PR-head declaration was consumed as inert data only; PR-head code was not executed in the trusted workflow.'
              echo '- No professional certification, transaction authority, external commercial Go-Live, or production-governance PASS is inferred.'
              echo '- Production governance automatically re-enters when internal mode is absent or no longer satisfies the fail-closed declaration.'
            else
              echo '- Upstream E2E/E2F/E2G production governance was verified by the immutable trusted verifier.'
            fi
            echo '- This check does not itself deploy or grant transaction authority.'
          } >> "$GITHUB_STEP_SUMMARY"
