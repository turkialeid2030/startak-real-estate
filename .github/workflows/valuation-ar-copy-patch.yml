name: Valuation Arabic Copy Patch

on:
  pull_request:
    branches:
      - wave/decision-governance-saudi-release-hardening-2026-09-15
    paths:
      - tools/apply-valuation-ar-copy-patch.js
      - .github/workflows/valuation-ar-copy-patch.yml

permissions:
  contents: write

jobs:
  patch-valuation-ar-copy:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wave/decision-governance-ui-integration-followup-2026-09-16'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout follow-up branch
        uses: actions/checkout@v4
        with:
          ref: wave/decision-governance-ui-integration-followup-2026-09-16
          fetch-depth: 0

      - name: Apply Arabic valuation-copy patch
        run: node tools/apply-valuation-ar-copy-patch.js

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ValuationIntelligenceBasePanel.jsx tests/e2e/run_full_e2e_ci.mjs
          if git diff --cached --quiet; then
            echo "No valuation copy changes to commit."
            exit 0
          fi
          git commit -m "Localize valuation controls for Arabic runtime"
          git push origin HEAD:wave/decision-governance-ui-integration-followup-2026-09-16
