name: C6 Browser E2E Controlled Human Review Verify

on:
  pull_request:
    paths:
      - 'src/contracts/governed-human-review.js'
      - 'src/decision-intelligence/governed-human-review.js'
      - 'src/app/governed-decision-operational.js'
      - 'src/app/valuation-saved-deal-bridge.js'
      - 'src/app/App.jsx'
      - 'src/components/GovernedDecisionOperationsPanel.jsx'
      - 'src/components/ValuationIntelligencePanel.jsx'
      - 'src/components/ResidentialIncomeAcquisitionPanel.jsx'
      - 'src/components/ResidentialIncomeAiAssistPanel.jsx'
      - 'src/components/RentRollCollectionsWorkspace.jsx'
      - 'src/validation/saved-deal-schema.js'
      - 'tests/fixtures/c6-governed-saved-deal.js'
      - 'tests/defects/c6_controlled_human_review_workflow.js'
      - 'tests/e2e/c6_governed_human_review.spec.js'
      - 'playwright.config.js'
      - 'docs/capabilities/C6_BROWSER_E2E_CONTROLLED_HUMAN_REVIEW.md'
      - '.github/workflows/c6-browser-e2e-controlled-human-review-verify.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C6 controlled human review regression
        run: node tests/defects/c6_controlled_human_review_workflow.js
      - name: C5 governed decision UI/export regression
        run: node tests/defects/c5_governed_decision_ui_export_integration.js
      - name: C4 governed decision/report regression
        run: node tests/defects/c4_governed_deal_decision_report_integration.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: C6 Chromium production-bundle end-to-end workflow
        run: npx playwright test tests/e2e/c6_governed_human_review.spec.js --project=chromium
      - name: Canonical release verification
        run: npm run release:verify
