name: C29 Governed Shadow Simulation UAT Harness Verify

on:
  pull_request:
    paths:
      - 'src/simulation/governed-shadow-simulation.js'
      - 'tests/defects/c29_governed_shadow_simulation_uat_harness.js'
      - 'docs/capabilities/C29_GOVERNED_SHADOW_SIMULATION_UAT_HARNESS.md'
      - '.github/workflows/c29-governed-shadow-simulation-uat-harness-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C29 shadow simulation and UAT harness regression
        run: node tests/defects/c29_governed_shadow_simulation_uat_harness.js
      - name: C28 comprehensive integration qualification regression
        run: node tests/defects/c28_comprehensive_integration_qualification.js
      - name: C23 AI proof-grounding regression
        run: node tests/defects/c23_governed_live_ai_provider_gateway.js
      - name: Canonical release verification
        run: npm run release:verify
