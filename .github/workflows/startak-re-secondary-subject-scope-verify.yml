name: STARTAK RE Secondary Subject and Export Scope Verify
on:
  pull_request:
    paths:
      - 'src/components/PropertyMarketLocationPanel.jsx'
      - 'src/components/MarketOfferResearchPanel.jsx'
      - 'src/components/CrossMethodEvidencePanel.jsx'
      - 'src/components/ResearchEvidenceFusionPanel.jsx'
      - 'tests/e2e/run_owner_market_independent_evidence.js'
      - '.github/workflows/startak-re-secondary-subject-scope-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node tests/defects/owner_market_evidence_scope.js
      - run: npm run build
      - name: Exercise live owner research in Chromium, Firefox and WebKit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/secondary-scope
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >runtime-evidence/secondary-scope/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          for browser in chromium firefox webkit; do
            STARTAK_BROWSER="$browser" STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_owner_market_independent_evidence.js 2>&1 | tee "runtime-evidence/secondary-scope/$browser.log"
          done
      - name: Upload anonymized browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startak-re-secondary-subject-scope
          path: runtime-evidence/secondary-scope
          if-no-files-found: warn
