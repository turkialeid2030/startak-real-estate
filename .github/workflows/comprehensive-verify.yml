name: Comprehensive Verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  comprehensive-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for real-browser tests
        run: npx playwright install --with-deps chromium

      - name: Canonical release verification
        run: npm run release:verify

      - name: Real-browser core runtime E2E
        run: node tests/e2e/run_runtime_e2e.mjs

      - name: Real-browser full UI E2E
        run: node tests/e2e/run_full_e2e_ci.mjs

      - name: Strict E2E qualification
        run: node tools/comprehensive-verify.js

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-runtime-evidence
          path: runtime-evidence/e2e
          if-no-files-found: error
