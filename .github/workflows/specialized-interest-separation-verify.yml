name: Specialized Interest Separation Verify

on:
  pull_request:
    paths:
      - 'src/specialized-assets/specialized-interest-separation.js'
      - 'src/specialized-assets/specialized-operating-forecast.js'
      - 'src/specialized-assets/specialized-asset-evidence.js'
      - 'tests/architecture/run_wave14g_specialized_interest_separation.js'
      - 'docs/WAVE_14G_SPECIALIZED_INTEREST_SEPARATION.md'
      - '.github/workflows/specialized-interest-separation-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 14G specialized interest separation
        run: node tests/architecture/run_wave14g_specialized_interest_separation.js
      - name: Canonical release verification
        run: npm run release:verify
