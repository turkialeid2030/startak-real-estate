name: Optional Property Indicators 775 Verify
on:
  pull_request:
    paths:
      - 'src/analysis/optional-property-indicators.js'
      - 'src/components/OptionalPropertyIndicatorsResearchPanel.jsx'
      - 'src/components/PersonalInvestmentResearchPanel.jsx'
      - 'tests/defects/optional_property_indicators_775.js'
      - 'tests/e2e/run_optional_property_indicators_775.js'
      - '.github/workflows/optional-property-indicators-775-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optional-property-indicators:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reference vectors and fail-closed gates
        run: node tests/defects/optional_property_indicators_775.js
      - name: Build current exact SHA
        run: npm run build
      - name: Run isolated research panel browser checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence/optional-indicators-775
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort >runtime-evidence/optional-indicators-775/vite.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /dev/null; then break; fi
            sleep 1
          done
          STARTAK_E2E_URL=http://127.0.0.1:4173 node tests/e2e/run_optional_property_indicators_775.js | tee runtime-evidence/optional-indicators-775/browser.log
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optional-indicators-775-evidence
          path: runtime-evidence/optional-indicators-775
          if-no-files-found: warn
