name: C7 Governed Correlated Monte Carlo Verify

on:
  pull_request:
    paths:
      - 'src/scenario-risk/correlated-monte-carlo.js'
      - 'src/uncertainty/correlated-monte-carlo-governance.js'
      - 'src/uncertainty/monte-carlo-governance.js'
      - 'src/scenario-risk/index.js'
      - 'src/valuation-intelligence/monte-carlo-risk.js'
      - 'tests/defects/c7_governed_correlated_monte_carlo.js'
      - 'tests/defects/financial_integrity_p7_monte_carlo.js'
      - 'docs/capabilities/C7_GOVERNED_CORRELATED_MONTE_CARLO.md'
      - '.github/workflows/c7-governed-correlated-monte-carlo-verify.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C7 governed correlated Monte Carlo regression
        run: node tests/defects/c7_governed_correlated_monte_carlo.js
      - name: Check exact code SHA
        run: |
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          git diff --exit-code
      - name: C7 capability isolation boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('src/app/App.jsx','utf8');
          if(app.includes('correlated-monte-carlo-governance')||app.includes('runCorrelatedMonteCarlo')) throw Error('C7_UNREVIEWED_UI_ACTIVATION');
          const standalone=require('./src/uncertainty/correlated-monte-carlo-governance');
          if(typeof standalone.executeGovernedCorrelatedMonteCarlo!=='function') throw Error('C7_NOT_EXPORTED');
          console.log('C7_ISOLATED_NON_PRODUCTION=PASS');
          NODE
      - name: Legacy Monte Carlo regression
        run: node tests/defects/financial_integrity_p7_monte_carlo.js
      - name: Canonical release verification
        run: npm run release:verify
