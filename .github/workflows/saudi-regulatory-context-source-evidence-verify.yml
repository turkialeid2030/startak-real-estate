name: Saudi Regulatory Context Source Evidence Verify

on:
  pull_request:
    paths:
      - 'governance/saudi-regulatory-context-source-evidence-2026-09-08.json'
      - 'tests/architecture/run_saudi_regulatory_context_source_evidence.js'
      - '.github/workflows/saudi-regulatory-context-source-evidence-verify.yml'
      - 'docs/SAUDI_REGULATORY_CONTEXT_SOURCE_VERIFICATION_2026-09-08.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Saudi regulatory context source evidence
        run: node tests/architecture/run_saudi_regulatory_context_source_evidence.js
      - name: Canonical release verification
        run: npm run release:verify
