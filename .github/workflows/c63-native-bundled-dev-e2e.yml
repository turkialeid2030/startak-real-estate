name: C63 Native Bundled Vite 8 Developer Bootstrap and React HMR
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'vite.config.js'
      - 'tests/e2e/run_c63_current_native_dev_hmr_browser.js'
      - '.github/workflows/c63-native-bundled-dev-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dev-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - name: Exact PR source under test
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install immutable dependencies
        run: npm ci
      - name: Install actual Chromium
        run: npx playwright install --with-deps chromium
      - name: Actual Vite 8 native bundle React startup and real HMR mutation
        run: node tests/e2e/run_c63_current_native_dev_hmr_browser.js
      - name: Verify source file was restored byte-for-byte
        run: test -z "$(git status --porcelain -- src/components/PersonalAssetUniversePanel.jsx)"
      - name: Canonical financial and security release verification
        run: npm run release:verify
