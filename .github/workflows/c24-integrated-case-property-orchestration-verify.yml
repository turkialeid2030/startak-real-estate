name: C24 Integrated Case Property Orchestration Verify

on:
  pull_request:
    paths:
      - 'src/orchestration/governed-case-property-orchestrator.js'
      - 'tests/defects/c24_integrated_case_property_orchestration.js'
      - 'docs/capabilities/C24_INTEGRATED_CASE_PROPERTY_ORCHESTRATION.md'
      - '.github/workflows/c24-integrated-case-property-orchestration-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C24 integrated orchestration adversarial regression
        run: node tests/defects/c24_integrated_case_property_orchestration.js
      - name: C23 proof-grounded provider gateway adversarial regression
        run: node tests/defects/c23_governed_live_ai_provider_gateway.js
      - name: Canonical release verification
        run: npm run release:verify
