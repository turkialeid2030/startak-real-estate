name: Property Evidence Bridge Verify

on:
  pull_request:
    paths:
      - 'src/property/**'
      - 'src/document-intelligence/**'
      - 'src/inspection/**'
      - 'src/valuation/professional-assignment.js'
      - 'tests/architecture/run_wave8c_property_evidence_bridge.js'
      - '.github/workflows/property-evidence-bridge-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 8C property evidence bridge
        run: node tests/architecture/run_wave8c_property_evidence_bridge.js
      - name: Canonical release verification
        run: npm run release:verify
