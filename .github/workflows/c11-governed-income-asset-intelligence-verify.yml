name: C11 Governed Income Asset Intelligence Verify

on:
  pull_request:
    paths:
      - 'src/market/lease-income-evidence.js'
      - 'src/income/governed-income-asset-intelligence.js'
      - 'src/income/index.js'
      - 'tests/defects/c11_governed_income_asset_intelligence.js'
      - 'docs/capabilities/C11_GOVERNED_INCOME_ASSET_INTELLIGENCE.md'
      - '.github/workflows/c11-governed-income-asset-intelligence-verify.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_SHA=$ACTUAL_SHA"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: C11 governed income asset intelligence regression
        run: node tests/defects/c11_governed_income_asset_intelligence.js
      - name: Canonical release verification
        run: npm run release:verify
