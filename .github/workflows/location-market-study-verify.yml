      - 'tests/defects/current_calculation_boundary_audit.js'
      - 'tests/defects/financial_market_identity_d06.js'
      - 'tests/defects/personal_study_status_clarity_d07.js'
      - 'src/i18n/market-study-core-labels.js'
      - 'src/reporting/financial-timing-basis-report.js'
      - 'src/app/personal-financial-study.js'
      - 'tests/defects/market_study_core_locale_d04.js'
      - 'tests/defects/fractional_construction_disclosure_d05.js'
