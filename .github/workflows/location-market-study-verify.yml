      - 'src/components/AppraisalAssuranceWorkbench.jsx'
      - 'src/components/LocalDocumentEvidenceWorkspace.jsx'
      - 'src/market/appraisal-assurance.js'
      - 'tests/e2e/run_appraisal_assurance_ci.mjs'
      - 'src/app/App.jsx'
