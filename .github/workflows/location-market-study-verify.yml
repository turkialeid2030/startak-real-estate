name: Location Market Study Verify
on:
  pull_request:
    paths:
      - 'src/market/instant-market-study.js'
      - 'src/market/public-dataset-import.js'
      - 'src/market/saudi-open-data-research.js'
      - 'src/components/PropertyMarketLocationPanel.jsx'
      - 'src/app/App.jsx'
      - 'tests/architecture/run_instant_market_study.js'
      - 'tests/architecture/run_public_market_csv_import.js'
      - 'tests/architecture/run_saudi_open_data_research.js'
      - 'tests/e2e/run_location_market_study_ci.mjs'
      - '.github/workflows/location-market-study-verify.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: node tests/architecture/run_instant_market_study.js
      - run: node tests/architecture/run_public_market_csv_import.js
      - run: node tests/architecture/run_saudi_open_data_research.js
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/run_location_market_study_ci.mjs
