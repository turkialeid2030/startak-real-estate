name: Release Governance Verify

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-governance-verify.yml'
      - 'governance/release-governance-policy.json'
      - 'tests/release/run_production_release_health_ci.mjs'
      - 'tests/release/run_release_governance_contract_ci.mjs'
      - 'docs/RELEASE_GOVERNANCE_WAVE4.md'
  workflow_run:
    workflows: ['Post-Release Production Verify']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-governance-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  release-governance:
    name: release-governance
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://startak-real-estate.pages.dev
      EXPECTED_DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT_NAME: startak-real-estate
      POLICY_PATH: governance/release-governance-policy.json
      EVIDENCE_DIR: runtime-evidence/release-governance

    steps:
      - name: Checkout governance contract
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release governance invariants
        run: node tests/release/run_release_governance_contract_ci.mjs

      - name: Observe production release health
        run: node tests/release/run_production_release_health_ci.mjs

      - name: Verify exact-SHA rollback readiness from Cloudflare deployment history
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test -n "${EXPECTED_DEPLOYED_SHA:-}" || { echo 'Expected deployed SHA is required in post-release chained mode.'; exit 1; }
          test -n "${CF_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN secret is missing.'; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID variable is missing.'; exit 1; }

          history_depth="$(jq -r '.rollbackReadiness.historyDepth' "$POLICY_PATH")"
          require_current="$(jq -r '.rollbackReadiness.requireCurrentSuccessfulDeployment' "$POLICY_PATH")"
          require_previous="$(jq -r '.rollbackReadiness.requirePreviousDistinctSuccessfulDeployment' "$POLICY_PATH")"
          automatic_rollback="$(jq -r '.rollbackReadiness.automaticRollback' "$POLICY_PATH")"
          rollback_authority="$(jq -r '.rollbackReadiness.rollbackAuthority' "$POLICY_PATH")"
          preferred_strategy="$(jq -r '.rollbackReadiness.preferredStrategy' "$POLICY_PATH")"

          [[ "$automatic_rollback" == 'false' ]] || { echo 'Policy forbids automatic rollback authority.'; exit 1; }

          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          deployments_json="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?env=production&per_page=${history_depth}")"
          jq -e '.success == true' <<<"$deployments_json" >/dev/null

          current="$(jq -c --arg sha "$EXPECTED_DEPLOYED_SHA" '[.result[] | select(((.source.config.commit_hash // .deployment_trigger.metadata.commit_hash // "") == $sha) and (.latest_stage.status == "success"))][0] // empty' <<<"$deployments_json")"
          previous="$(jq -c --arg sha "$EXPECTED_DEPLOYED_SHA" '[.result[] | select(((.source.config.commit_hash // .deployment_trigger.metadata.commit_hash // "") != $sha) and (.latest_stage.status == "success"))][0] // empty' <<<"$deployments_json")"

          if [[ "$require_current" == 'true' ]]; then
            test -n "$current" || { echo "No successful current production deployment found for ${EXPECTED_DEPLOYED_SHA}."; exit 1; }
          fi
          if [[ "$require_previous" == 'true' ]]; then
            test -n "$previous" || { echo 'No previous distinct successful production deployment found for rollback readiness.'; exit 1; }
          fi

          current_id="$(jq -r '.id // empty' <<<"$current")"
          current_url="$(jq -r '.url // empty' <<<"$current")"
          current_created="$(jq -r '.created_on // empty' <<<"$current")"
          previous_id="$(jq -r '.id // empty' <<<"$previous")"
          previous_sha="$(jq -r '.source.config.commit_hash // .deployment_trigger.metadata.commit_hash // empty' <<<"$previous")"
          previous_url="$(jq -r '.url // empty' <<<"$previous")"
          previous_created="$(jq -r '.created_on // empty' <<<"$previous")"

          test -n "$current_id" || { echo 'Current deployment ID is missing.'; exit 1; }
          test -n "$previous_id" || { echo 'Previous rollback-candidate deployment ID is missing.'; exit 1; }
          test -n "$previous_sha" || { echo 'Previous rollback-candidate commit SHA is missing.'; exit 1; }
          [[ "$previous_sha" != "$EXPECTED_DEPLOYED_SHA" ]] || { echo 'Rollback candidate must be a distinct commit.'; exit 1; }

          jq -n \
            --arg policyId "$(jq -r '.policyId' "$POLICY_PATH")" \
            --arg expectedSha "$EXPECTED_DEPLOYED_SHA" \
            --arg currentId "$current_id" \
            --arg currentUrl "$current_url" \
            --arg currentCreated "$current_created" \
            --arg previousId "$previous_id" \
            --arg previousSha "$previous_sha" \
            --arg previousUrl "$previous_url" \
            --arg previousCreated "$previous_created" \
            --arg rollbackAuthority "$rollback_authority" \
            --arg preferredStrategy "$preferred_strategy" \
            '{
              schemaVersion: 1,
              suite: "STARTAK_ROLLBACK_READINESS_V1",
              policyId: $policyId,
              expectedDeployedSha: $expectedSha,
              currentProduction: { deploymentId: $currentId, commitSha: $expectedSha, url: $currentUrl, createdOn: $currentCreated, status: "success" },
              rollbackCandidate: { deploymentId: $previousId, commitSha: $previousSha, url: $previousUrl, createdOn: $previousCreated, status: "success" },
              automaticRollback: false,
              rollbackAuthority: $rollbackAuthority,
              preferredStrategy: $preferredStrategy,
              transactionAuthorized: false,
              result: "PASS"
            }' > "$EVIDENCE_DIR/rollback-readiness.json"

          echo "ROLLBACK_READINESS=PASS -- current=${EXPECTED_DEPLOYED_SHA:0:12} previous=${previous_sha:0:12}"

      - name: Build unified release evidence record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          node --input-type=module <<'NODE'
          import fs from 'fs';
          const dir = process.env.EVIDENCE_DIR;
          const read = (name) => {
            const path = `${dir}/${name}`;
            return fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          };
          const health = read('production-release-health.json');
          const rollback = read('rollback-readiness.json');
          const evidence = {
            schemaVersion: 1,
            suite: 'STARTAK_RELEASE_GOVERNANCE_EVIDENCE_V1',
            policyId: 'STARTAK_RELEASE_GOVERNANCE_V1',
            eventName: process.env.GITHUB_EVENT_NAME,
            expectedDeployedSha: process.env.EXPECTED_DEPLOYED_SHA || null,
            githubRunId: process.env.GITHUB_RUN_ID,
            health,
            rollback,
            exactShaChainRequired: process.env.GITHUB_EVENT_NAME === 'workflow_run',
            automaticRollback: false,
            transactionAuthorized: false,
            generatedAt: new Date().toISOString(),
          };
          fs.writeFileSync(`${dir}/release-governance-evidence.json`, JSON.stringify(evidence, null, 2));
          NODE

      - name: Upload release governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-governance-evidence-${{ github.run_id }}
          path: runtime-evidence/release-governance
          if-no-files-found: error
          retention-days: 90

      - name: Publish release governance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## STARTAK Release Governance Verification'
            echo
            echo "- Production URL: \`${BASE_URL}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            if [[ -n "${EXPECTED_DEPLOYED_SHA:-}" ]]; then
              echo "- Exact deployed SHA inherited from successful Post-Release Production Verify: \`${EXPECTED_DEPLOYED_SHA}\`"
              if [[ -f "$EVIDENCE_DIR/rollback-readiness.json" ]]; then
                previous_sha="$(jq -r '.rollbackCandidate.commitSha' "$EVIDENCE_DIR/rollback-readiness.json")"
                echo "- Verified previous successful rollback candidate: \`${previous_sha}\`"
              fi
            else
              echo '- Pull-request/manual mode observes current production health; exact-SHA rollback readiness is intentionally deferred to the post-merge chained run.'
            fi
            echo '- Release-health policy: 5 samples, 100% success required, zero HTTP 5xx, p95 response time <= 5000 ms.'
            echo '- Automatic rollback is prohibited. Any production rollback requires explicit human authorization.'
            echo '- A failing workflow check is the primary release-health alert surface.'
            echo '- No transaction authority is granted.'
          } >> "$GITHUB_STEP_SUMMARY"
