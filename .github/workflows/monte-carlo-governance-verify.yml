name: Monte Carlo Governance Verify

on:
  pull_request:
    paths:
      - 'src/uncertainty/**'
      - 'src/scenario-risk/**'
      - 'tests/architecture/run_scenario_risk_intelligence_v1.js'
      - 'tests/architecture/run_wave16a_monte_carlo_governance.js'
      - '.github/workflows/monte-carlo-governance-verify.yml'
      - 'docs/WAVE_16A_MONTE_CARLO_GOVERNANCE.md'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Existing scenario risk regression
        run: node tests/architecture/run_scenario_risk_intelligence_v1.js
      - name: Wave 16A Monte Carlo governance regression
        run: node tests/architecture/run_wave16a_monte_carlo_governance.js
      - name: Canonical release verification
        run: npm run release:verify
