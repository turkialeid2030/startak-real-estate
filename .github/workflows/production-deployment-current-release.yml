name: Current Release Production Deployment

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact trusted main SHA to deploy'
        required: true
        type: string
      confirm_production_deployment:
        description: 'Type I_AUTHORIZE_CURRENT_RELEASE_PRODUCTION_DEPLOYMENT'
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  QUALIFIED_CANDIDATE_SHA: bca14e1ace3be59a7e51f43132657c636639116d
  QUALIFIED_ARTIFACT_SHA256: 5524256a7308c22739bf0fd5c706c07306aac1cb114dbc53d746132cd2f62c2b
  CF_PROJECT_NAME: startak-real-estate
  CF_PRODUCTION_HOST: startak-real-estate.pages.dev

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 351 &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/startak deploy-production '))
    name: deploy-current-release-production
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    env:
      CF_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bind deployment to exact trusted main and owner authorization
        id: bind
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirm_production_deployment }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            [[ "$DISPATCH_CONFIRMATION" == 'I_AUTHORIZE_CURRENT_RELEASE_PRODUCTION_DEPLOYMENT' ]] || { echo 'Explicit production deployment authorization missing.'; exit 1; }
            requested="$(printf '%s' "$DISPATCH_EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          else
            [[ "$COMMENT_ACTOR" == "$REPOSITORY_OWNER" ]] || { echo 'Owner-only production command.'; exit 1; }
            [[ "$COMMENT_BODY" =~ ^/startak[[:space:]]deploy-production[[:space:]]([a-fA-F0-9]{40})[[:space:]]*$ ]] || { echo 'Malformed production command.'; exit 1; }
            requested="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')"
          fi
          [[ "$requested" =~ ^[a-f0-9]{40}$ ]] || { echo 'Expected main SHA malformed.'; exit 1; }
          current_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}' | tr '[:upper:]' '[:lower:]')"
          [[ "$current_main" == "$requested" ]] || { echo "Trusted main changed: requested=$requested current=$current_main"; exit 1; }
          echo "expected_main_sha=$requested" >> "$GITHUB_OUTPUT"
          echo "EXPECTED_MAIN_SHA=$requested" >> "$GITHUB_ENV"

      - name: Normalize Cloudflare API token formatting
        shell: bash
        run: |
          set -euo pipefail
          raw="${CF_API_TOKEN_RAW:-}"
          test -n "$raw" || { echo 'CLOUDFLARE_CREDENTIAL_STATUS=MISSING'; echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_STATUS=MISSING'; echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }

          token="${raw//$'\r'/}"
          token="${token//$'\n'/}"
          token="${token#"${token%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"

          case "$token" in
            Bearer\ *) token="${token#Bearer }" ;;
            bearer\ *) token="${token#bearer }" ;;
          esac

          token="${token#"${token%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"

          if [[ ${#token} -ge 2 && "${token:0:1}" == '"' && "${token: -1}" == '"' ]]; then
            token="${token:1:${#token}-2}"
          elif [[ ${#token} -ge 2 && "${token:0:1}" == "'" && "${token: -1}" == "'" ]]; then
            token="${token:1:${#token}-2}"
          fi

          token="${token#"${token%%[![:space:]]*}"}"
          token="${token%"${token##*[![:space:]]}"}"

          test -n "$token" || { echo 'CLOUDFLARE_CREDENTIAL_STATUS=EMPTY_AFTER_NORMALIZATION'; echo 'CLOUDFLARE_API_TOKEN became empty after safe formatting normalization'; exit 1; }
          [[ "$token" != *[[:space:]]* ]] || { echo 'CLOUDFLARE_CREDENTIAL_STATUS=MALFORMED_INTERNAL_WHITESPACE'; echo 'CLOUDFLARE_API_TOKEN contains internal whitespace and is malformed'; exit 1; }

          echo "::add-mask::$token"
          if [[ "$token" != "$raw" ]]; then
            echo 'Cloudflare API token formatting normalized without disclosure.'
          else
            echo 'Cloudflare API token formatting already canonical.'
          fi
          printf 'CF_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CF_ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Verify Cloudflare project access and fail-closed production posture
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}" || { echo 'CLOUDFLARE_CREDENTIAL_STATUS=NORMALIZED_TOKEN_MISSING'; echo 'Normalized Cloudflare API token missing'; exit 1; }
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          body="$(mktemp)"
          status="$(curl --silent --show-error -o "$body" -w '%{http_code}' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}" || true)"
          if [[ "$status" != '200' ]]; then
            error_code="$(jq -r '.errors[0].code // empty' "$body" 2>/dev/null || true)"
            if [[ "$status" == '400' && "$error_code" == '9106' ]]; then
              echo 'CLOUDFLARE_CREDENTIAL_STATUS=REJECTED_9106'
              echo 'Cloudflare rejected the configured production credential (HTTP 400 code=9106). Rotate/replace the production environment secret CLOUDFLARE_API_TOKEN with a valid raw Cloudflare API Token authorized for this account/project; do not weaken authentication or bypass this gate.'
            else
              echo "CLOUDFLARE_CREDENTIAL_STATUS=PROJECT_PREFLIGHT_FAILED_HTTP_${status}${error_code:+_CODE_${error_code}}"
              echo "Cloudflare Pages project preflight failed: HTTP ${status}${error_code:+ code=${error_code}}"
            fi
            rm -f "$body"
            exit 1
          fi
          project_json="$(cat "$body")"
          rm -f "$body"
          jq -e '.success == true' <<<"$project_json" >/dev/null
          jq -e '.result.production_branch == "main"' <<<"$project_json" >/dev/null
          jq -e '.result.deployment_configs.production.fail_open == false' <<<"$project_json" >/dev/null
          jq -e '.result.deployment_configs.production.env_vars.RIAI_PUBLIC_AI_ENABLED.value == "false"' <<<"$project_json" >/dev/null
          echo 'CLOUDFLARE_CREDENTIAL_STATUS=PROJECT_ACCESS_PASS'
          echo 'Cloudflare project-scoped bearer access and fail-closed production posture: PASS'

      - name: Checkout exact trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.bind.outputs.expected_main_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Canonical release verification
        env:
          STARTAK_SOURCE_COMMIT: ${{ steps.bind.outputs.expected_main_sha }}
          STARTAK_BUILD_ENVIRONMENT: github-actions:production-deployment
        run: npm run release:verify

      - name: Deploy verified dist to Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist --project-name "$CF_PROJECT_NAME" --branch main --commit-hash "$EXPECTED_MAIN_SHA"

      - name: Verify provider deployment identity
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CF_API_TOKEN}" -H 'Content-Type: application/json')
          for attempt in $(seq 1 12); do
            deployments="$(curl --fail-with-body --silent --show-error "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${CF_PROJECT_NAME}/deployments?env=production&per_page=10")"
            deployed_sha="$(jq -r '(.result | map(select((.environment // "") == "production" and (.latest_stage.status // "") == "success")) | first | (.source.config.commit_hash // .deployment_trigger.metadata.commit_hash // ""))' <<<"$deployments" | tr '[:upper:]' '[:lower:]')"
            if [[ "$deployed_sha" == "$EXPECTED_MAIN_SHA" ]]; then
              echo "PRODUCTION_DEPLOYMENT_IDENTITY=PASS sha=$deployed_sha"
              exit 0
            fi
            sleep 5
          done
          echo 'Production did not converge to expected main SHA.'
          exit 1

      - name: Production HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          url="https://${CF_PRODUCTION_HOST}/"
          for attempt in $(seq 1 12); do
            code="$(curl -L -sS -o /tmp/startak-production.html -w '%{http_code}' "$url" || true)"
            if [[ "$code" =~ ^[23] ]]; then
              test -s /tmp/startak-production.html
              echo "PRODUCTION_HTTP_SMOKE=PASS status=$code"
              exit 0
            fi
            sleep 5
          done
          echo 'Production HTTP smoke test failed.'
          exit 1

      - name: Publish deployment boundary
        shell: bash
        run: |
          echo 'Production deployment completed for exact trusted main.' >> "$GITHUB_STEP_SUMMARY"
          echo "- deployedMainSha: $EXPECTED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- qualifiedCandidateSha: $QUALIFIED_CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- predecessorQualifiedArtifactSha256: $QUALIFIED_ARTIFACT_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo '- publicAIActivated: false' >> "$GITHUB_STEP_SUMMARY"
          echo '- transactionAuthority: false' >> "$GITHUB_STEP_SUMMARY"
          echo '- canonicalBaselineActivation: not granted by this workflow' >> "$GITHUB_STEP_SUMMARY"
