name: E2B External Review Credential Evidence Verify

on:
  pull_request:
    paths:
      - 'governance/e2b-external-review-evidence-requirements-2026-09-08.json'
      - 'src/standards/external-review-credential-evidence.js'
      - 'tests/architecture/run_e2b_external_review_credential_evidence.js'
      - 'docs/E2B_EXTERNAL_REVIEW_CREDENTIAL_EVIDENCE_2026-09-08.md'
      - '.github/workflows/e2b-external-review-credential-evidence-verify.yml'
      - 'governance/saudi-legal-professional-applicability-candidates-2026-09-08.json'
      - 'src/standards/saudi-legal-professional-applicability.js'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify E2B external review and credential evidence envelope
        run: node tests/architecture/run_e2b_external_review_credential_evidence.js
      - name: Re-verify E2 applicability gate
        run: node tests/architecture/run_e2_saudi_legal_professional_applicability.js
      - name: Canonical release verification
        run: npm run release:verify
