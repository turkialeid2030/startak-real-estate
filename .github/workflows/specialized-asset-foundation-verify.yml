name: Specialized Asset Foundation Verify

on:
  pull_request:
    paths:
      - 'src/specialized-assets/specialized-asset-evidence.js'
      - 'tests/architecture/run_wave14a_specialized_asset_foundation.js'
      - 'docs/WAVE_14A_SPECIALIZED_ASSET_FOUNDATION.md'
      - '.github/workflows/specialized-asset-foundation-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Wave 14A specialized asset foundation
        run: node tests/architecture/run_wave14a_specialized_asset_foundation.js
      - name: Canonical release verification
        run: npm run release:verify
