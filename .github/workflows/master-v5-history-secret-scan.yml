name: MASTER V5 reachable Git history secret scan
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: master-v5-history-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fetch all advertised branch and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install version-pinned scanner
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""
          GOPRIVATE: ""
          GOINSECURE: ""
          GOTOOLCHAIN: auto
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/master-v5-bin" go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan reachable history with no public findings or artifacts
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scan_dir="$(mktemp -d "$RUNNER_TEMP/master-v5-scan.XXXXXX")"
          trap 'rm -rf "$scan_dir"' EXIT
          test "$(git rev-parse --is-shallow-repository)" = false
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          touch "$scan_dir/.gitleaksignore"
          printf 'ADVERTISED_REFS=%s\n' "$(git for-each-ref --format='%(refname)' refs/remotes refs/tags | wc -l)"
          printf 'REACHABLE_COMMITS=%s\n' "$(git rev-list --all --count)"
          set +e
          "$RUNNER_TEMP/master-v5-bin/gitleaks" git \
            --config "$scan_dir/config.toml" \
            --gitleaks-ignore-path "$scan_dir/.gitleaksignore" \
            --ignore-gitleaks-allow --redact=100 --exit-code=42 \
            --log-opts="--all --full-history" \
            --report-format=json --report-path="$scan_dir/report.json" \
            . > "$scan_dir/scanner.log" 2>&1
          result=$?
          set -e
          case "$result" in
            0) echo 'REACHABLE_HISTORY_SCAN=PASS_NO_MATCHES_DETECTED' ;;
            42) echo 'REACHABLE_HISTORY_SCAN=HOLD_REVIEW_FINDINGS_PRIVATELY'; exit 1 ;;
            *) echo 'REACHABLE_HISTORY_SCAN=ERROR_NOT_QUALIFIED'; exit 2 ;;
          esac
          echo 'SCOPE=advertised fetched refs and reachable Git history only'
          echo 'LIMITATIONS=deleted or hidden refs, forks, LFS payloads, external systems and credential validity are not certified'
          echo 'PRODUCTION_AUTHORIZATION=HOLD'
