name: GitHub Actions Supply Chain Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  github-actions-supply-chain-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Inventory workflow action references
        run: node tools/github-actions-supply-chain-audit.js
